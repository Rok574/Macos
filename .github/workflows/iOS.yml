name: Remote iOS 26.5 Simulator

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'iOS version'
        default: '26.5'
        required: true
      device:
        description: 'Simulator device name'
        default: 'iPhone 17 Pro'
        required: true
      audio:
        description: 'Stream simulator audio + microphone'
        type: boolean
        default: true
      timezone:
        description: 'Time zone'
        default: 'America/New_York'
        required: true

jobs:
  simulator:
    name: iOS ${{ inputs.version }}
    runs-on: macos-26
    timeout-minutes: 355
    env:
      VER: ${{ inputs.version }}
      DEVICE: ${{ inputs.device }}
      AUDIO: ${{ inputs.audio }}
      TZNAME: ${{ inputs.timezone }}
      # Hard-coded for speed + stability
      MINUTES: '300'
      FPS: '24'
      SCALE: '0.35'
      QUALITY: '0.40'

    steps:
      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then
            echo "No Xcode 26 found"
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Ensure iOS runtime
        run: |
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -q "iOS ${VER}"; then
            echo "Downloading runtime..."
            xcodebuild -downloadPlatform iOS -buildVersion "${VER}" || true
          fi
          xcrun simctl list runtimes

      - name: Install BlackHole + route audio
        if: ${{ inputs.audio }}
        continue-on-error: true
        run: |
          brew install switchaudio-osx
          brew install --cask blackhole-2ch blackhole-16ch
          sudo killall coreaudiod || true
          sleep 4
          for i in $(seq 1 25); do
            SwitchAudioSource -a -t output | grep -q "BlackHole 2ch" && \
            SwitchAudioSource -a -t input  | grep -q "BlackHole 16ch" && break
            sleep 1
          done
          SwitchAudioSource -s "BlackHole 2ch" -t output || true
          SwitchAudioSource -s "BlackHole 16ch" -t input  || true
          echo "Output → $(SwitchAudioSource -c -t output)"
          echo "Input  → $(SwitchAudioSource -c -t input)"

      - name: Set time zone
        continue-on-error: true
        run: |
          sudo systemsetup -settimezone "$TZNAME" || true
          date

      - name: Grant microphone permissions
        if: ${{ inputs.audio }}
        continue-on-error: true
        run: |
          PYS=$(ls /Users/runner/hostedtoolcache/Python/*/*/bin/python3* 2>/dev/null | tr '\n' ' ')
          XC=$(xcode-select -p)
          APP="${XC%/Developer}"
          CLIENTS_BID="com.apple.Terminal com.apple.dt.Xcode com.apple.CoreSimulator.CoreSimulatorService com.apple.iphonesimulator"
          CLIENTS_PATH="/bin/bash /bin/zsh /usr/bin/python3 /usr/bin/xcrun $APP/Contents/Developer/Applications/Simulator.app $(command -v python3 || true) $PYS"
          add() {
            db="$1"; svc="$2"; client="$3"; ctype="$4"
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier_type,indirect_object_identifier,flags,last_modified) VALUES ('$svc','$client',$ctype,2,4,1,0,'UNUSED',0,strftime('%s','now'));" 2>/dev/null || true
          }
          for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
            [ -f "$db" ] || continue
            for c in $CLIENTS_BID; do add "$db" kTCCServiceMicrophone "$c" 0; done
            for c in $CLIENTS_PATH; do [ -n "$c" ] && add "$db" kTCCServiceMicrophone "$c" 1; done
          done
          sudo killall tccd 2>/dev/null || true
          sleep 1

      - name: Create and boot simulator
        run: |
          RT_ID=$(xcrun simctl list runtimes -j | jq -r --arg v "$VER" \
            '[.runtimes[] | select(.platform=="iOS" and (.version|startswith($v)))][0].identifier // empty')
          if [ -z "$RT_ID" ]; then
            RT_ID=$(xcrun simctl list runtimes -j | jq -r \
              '[.runtimes[] | select(.platform=="iOS" and .isAvailable==true)] | sort_by(.version | split(".") | map(tonumber? // 0)) | last | .identifier // empty')
          fi
          [ -n "$RT_ID" ] || { echo "No iOS runtime"; exit 1; }
          echo "Runtime: $RT_ID"

          DT=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" --arg n "$DEVICE" \
            '[.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | select(.name==$n)][0].identifier // empty')
          if [ -z "$DT" ]; then
            DT=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" \
              '[.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | select(.productFamily=="iPhone")][0].identifier')
          fi
          UDID=$(xcrun simctl create "Remote-$VER" "$DT" "$RT_ID")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl privacy "$UDID" grant microphone || true
          xcrun simctl privacy "$UDID" grant location || true
          xcrun simctl location "$UDID" set 37.7749,-122.4194 || true
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl list devices | grep "$UDID"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          brew install cloudflared
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion
          pip install fb-idb aiohttp sounddevice
          idb --help | head -2
          cloudflared --version

      - name: Install simpod
        continue-on-error: true
        run: |
          if ! command -v dart >/dev/null; then
            brew tap dart-lang/dart
            brew trust dart-lang/dart || true
            brew install dart
          fi
          dart pub global activate simpod
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build button bridge
        continue-on-error: true
        run: |
          brew install xcodegen
          mkdir -p bridge/Host bridge/BridgeUITests
          cd bridge
          cat > project.yml <<'YML'
          name: Bridge
          options:
            bundleIdPrefix: dev.bridge
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              GENERATE_INFOPLIST_FILE: YES
              CODE_SIGNING_ALLOWED: NO
              CODE_SIGNING_REQUIRED: NO
          targets:
            Host:
              type: application
              platform: iOS
              sources: [Host]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: dev.bridge.host
            BridgeUITests:
              type: bundle.ui-testing
              platform: iOS
              sources: [BridgeUITests]
              dependencies:
                - target: Host
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: dev.bridge.uitests
          schemes:
            Bridge:
              build:
                targets:
                  Host: all
                  BridgeUITests: [test]
              test:
                targets: [BridgeUITests]
          YML
          cat > Host/App.swift <<'SW'
          import SwiftUI
          @main struct HostApp: App { var body: some Scene { WindowGroup { Text("button bridge") } } }
          SW
          cat > BridgeUITests/ButtonBridge.swift <<'SW'
          import XCTest
          final class ButtonBridge: XCTestCase {
              @MainActor
              func setVolume(_ delta: Double) -> String {
                  let sb = XCUIApplication(bundleIdentifier: "com.apple.springboard")
                  let top = sb.coordinate(withNormalizedOffset: CGVector(dx: 0.95, dy: 0.0))
                  let mid = sb.coordinate(withNormalizedOffset: CGVector(dx: 0.95, dy: 0.5))
                  top.press(forDuration: 0.1, thenDragTo: mid)
                  Thread.sleep(forTimeInterval: 0.8)
                  let pred = NSPredicate(format: "label CONTAINS[c] 'volume' OR identifier CONTAINS[c] 'volume'")
                  let slider = sb.sliders.matching(pred).firstMatch
                  var result = "volume slider not found"
                  if slider.waitForExistence(timeout: 2) {
                      var cur = 0.5
                      if let s = slider.value as? String, let n = Double(s.replacingOccurrences(of: "%", with: "")) { cur = n / 100 }
                      let next = min(1.0, max(0.0, cur + delta))
                      slider.adjust(toNormalizedSliderPosition: CGFloat(next))
                      result = "ok"
                  }
                  XCUIDevice.shared.press(.home)
                  return result
              }
              @MainActor
              func testLoop() throws {
                  continueAfterFailure = true
                  let home = ProcessInfo.processInfo.environment["SIMULATOR_HOST_HOME"] ?? NSHomeDirectory()
                  let cmd = home + "/xcbtn.cmd", ready = home + "/xcbtn.ready", out = home + "/xcbtn.result"
                  let fm = FileManager.default
                  fm.createFile(atPath: ready, contents: Data("1".utf8))
                  defer { try? fm.removeItem(atPath: ready) }
                  let device = XCUIDevice.shared
                  let end = Date().addingTimeInterval(6 * 3600)
                  while Date() < end {
                      if let data = fm.contents(atPath: cmd), let raw = String(data: data, encoding: .utf8) {
                          try? fm.removeItem(atPath: cmd)
                          let c = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                          var result = "ok"
                          if c == "action" {
                              if device.hasHardwareButton(.action) { device.press(.action) }
                              else { result = "unsupported Action Button" }
                          } else if c == "volume_up" {
                              result = self.setVolume(0.0625)
                          } else if c == "volume_down" {
                              result = self.setVolume(-0.0625)
                          } else if c.hasPrefix("siri:") {
                              device.siriService.activate(voiceRecognitionText: String(c.dropFirst(5)))
                          } else {
                              result = "unknown command"
                          }
                          fm.createFile(atPath: out, contents: Data(result.utf8))
                      }
                      Thread.sleep(forTimeInterval: 0.05)
                  }
              }
          }
          SW
          xcodegen generate
          xcodebuild build-for-testing -project Bridge.xcodeproj -scheme Bridge \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tail -15
          ls build/Build/Products/*.xctestrun || true

      - name: Write the web server
        run: |
          cat > server.py <<'PYEOF'
          # ============================================================
          # You still need to paste the FULL server.py from your uploaded
          # file into this block, then replace the stream_idb + capture
          # functions with the pure-idb versions shown in previous messages.
          # ============================================================
          print("Paste full server.py here")
          PYEOF
          echo "WARNING: Paste the complete server.py content from your previous file!"

      - name: Start session
        run: |
          export TOKEN=$(openssl rand -hex 12)
          export PORT=8080
          export FPS="${FPS:-24}"
          export SCALE="${SCALE:-0.35}"
          export QUALITY="${QUALITY:-0.40}"
          export GRPC_PORT=10882

          command -v cloudflared >/dev/null || { echo "cloudflared missing"; exit 1; }

          if [ "$AUDIO" = "true" ] && command -v SwitchAudioSource >/dev/null; then
            SwitchAudioSource -s "BlackHole 2ch" -t output || true
            SwitchAudioSource -s "BlackHole 16ch" -t input  || true
          fi

          if command -v idb_companion >/dev/null; then
            nohup idb_companion --udid "$UDID" --grpc-port "$GRPC_PORT" > companion.log 2>&1 &
            for i in $(seq 1 30); do nc -z localhost "$GRPC_PORT" 2>/dev/null && break; sleep 1; done
            idb connect localhost "$GRPC_PORT" || true
          fi

          rm -f "$HOME"/xcbtn.*
          XR=$(ls bridge/build/Build/Products/*.xctestrun 2>/dev/null | head -1 || true)
          if [ -n "$XR" ]; then
            touch "$HOME/xcbtn.running"
            XR="$XR" UDID="$UDID" nohup bash -c 'while true; do xcodebuild test-without-building -xctestrun "$XR" -destination "id=$UDID" >> bridge.log 2>&1; rm -f "$HOME/xcbtn.ready"; sleep 2; done' &
          fi

          nohup python3 server.py > server.log 2>&1 &
          SERVER_PID=$!

          for i in $(seq 1 45); do
            curl -fsS "http://127.0.0.1:$PORT/?key=$TOKEN" -o /dev/null && break
            kill -0 "$SERVER_PID" 2>/dev/null || { cat server.log; exit 1; }
            sleep 1
          done

          nohup cloudflared tunnel --url "http://127.0.0.1:$PORT" --no-autoupdate --protocol http2 > cf.log 2>&1 &
          CF_PID=$!

          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ] || { cat cf.log; exit 1; }

          FULL="$URL/?key=$TOKEN"
          echo "========================================"
          echo "OPEN THIS: $FULL"
          echo "========================================"
          echo "::notice title=Simulator link::$FULL"
          echo "## Live simulator" >> "$GITHUB_STEP_SUMMARY"
          echo "$FULL" >> "$GITHUB_STEP_SUMMARY"

          END=$((SECONDS + MINUTES * 60))
          while kill -0 "$SERVER_PID" 2>/dev/null && [ "$SECONDS" -lt "$END" ]; do sleep 8; done

          kill "$SERVER_PID" "$CF_PID" 2>/dev/null || true
          xcrun simctl shutdown "$UDID" || true
