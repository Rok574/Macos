          }

          ['pointerup','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(actx&&actx.state==='suspended')actx.resume();if(mctx&&mctx.state==='suspended')mctx.resume()},{passive:true}));
          audioOn();
          if(actx&&actx.state==='suspended')toast('tap anywhere to start sound');

          function frac(x,y){const r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(x-r.left)/r.width)),Math.min(1,Math.max(0,(y-r.top)/r.height))]}
          function ripple(x,y){const r=scr.getBoundingClientRect(),d=document.createElement('div');d.className='rip';d.style.left=(x-r.left)+'px';d.style.top=(y-r.top)+'px';scr.appendChild(d);setTimeout(()=>d.remove(),450)}
          let pid=null,mpend=null,mraf=0,lastPt=[0,0];
          function tsend(t,p){if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:t,x:p[0],y:p[1]}))}
          function flushMove(){mraf=0;if(mpend&&pid!==null){tsend('tm',mpend);lastPt=mpend}mpend=null}
          function touchEnd(e){
            if(e.pointerId!==pid)return;
            if(mraf){cancelAnimationFrame(mraf);mraf=0}
            const p=e.type==='pointercancel'?(mpend||lastPt):frac(e.clientX,e.clientY);
            mpend=null;tsend('tu',p);pid=null;e.preventDefault();
          }
          scr.addEventListener('pointerdown',e=>{
            e.preventDefault();
            if(pid!==null)return;
            pid=e.pointerId;scr.setPointerCapture(pid);
            ripple(e.clientX,e.clientY);
            lastPt=frac(e.clientX,e.clientY);tsend('td',lastPt);
          });
          scr.addEventListener('pointermove',e=>{
            if(e.pointerId!==pid)return;
            e.preventDefault();
            mpend=frac(e.clientX,e.clientY);
            if(!mraf)mraf=requestAnimationFrame(flushMove);
          });
          scr.addEventListener('pointerup',touchEnd);
          scr.addEventListener('pointercancel',touchEnd);
          scr.addEventListener('lostpointercapture',e=>{if(e.pointerId===pid)touchEnd({pointerId:pid,type:'pointercancel',preventDefault(){}})});

          function setConn(ok){$('dot').classList.toggle('ok',ok);$('conn').textContent=ok?'Connected':'Reconnecting...'}
          document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
            document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
            document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.tab));
            if(b.dataset.tab==='apps')loadApps();
            if(b.dataset.tab==='console'){unread=0;document.getElementById('cbadge').textContent='';const c=document.getElementById('clog');c.scrollTop=c.scrollHeight}
          }));

          function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
          function appRow(a,user){
            const row=el('div','app'),info=el('div','info');
            info.appendChild(el('b',null,a.name));info.appendChild(el('small',null,a.id));
            row.appendChild(info);
            const open=el('button','sm primary','Open');open.onclick=()=>post('/launch',{bundle:a.id});row.appendChild(open);
            if(user){
              const stop=el('button','sm','Stop');stop.onclick=()=>post('/kill',{bundle:a.id});row.appendChild(stop);
              const del=el('button','sm danger','Delete');
              del.onclick=()=>{if(confirm('Delete '+a.name+'?')){post('/uninstall',{bundle:a.id});setTimeout(loadApps,1500)}};
              row.appendChild(del);
            }
            return row;
          }
          async function loadApps(){
            const box=$('apps');
            try{
              const r=await fetch('/apps',{credentials:'same-origin'}),j=await r.json();
              box.textContent='';
              const user=j.apps.filter(a=>a.user),sys=j.apps.filter(a=>!a.user);
              if(!user.length)box.appendChild(el('div','muted','No installed apps yet. Install one above.'));
              user.forEach(a=>box.appendChild(appRow(a,true)));
              if(sys.length){
                const d=el('details','sysapps');d.appendChild(el('summary',null,'System apps ('+sys.length+')'));
                sys.forEach(a=>d.appendChild(appRow(a,false)));box.appendChild(d);
              }
            }catch(e){box.textContent='Could not load apps'}
          }
          function upload(file){
            if(!file)return;
            const pb=$('prog'),bar=$('progbar'),msg=$('upmsg');
            pb.classList.add('on');bar.style.width='0%';msg.textContent='Uploading...';
            const x=new XMLHttpRequest();
            x.open('POST','/install?name='+encodeURIComponent(file.name)+'&launch='+($('launchafter').checked?1:0));
            x.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);bar.style.width=p+'%';msg.textContent='Uploading '+p+'%'}};
            x.upload.onload=()=>{msg.textContent='Installing...'};
            x.onload=()=>{
              pb.classList.remove('on');
              let j={};try{j=JSON.parse(x.responseText)}catch(e){j={msg:'HTTP '+x.status+(x.status===413?' (file too large for the tunnel, use a link)':'')}}
              msg.textContent=j.msg||'';toast(j.msg||'done');loadApps();
            };
            x.onerror=()=>{pb.classList.remove('on');msg.textContent='Upload failed';toast('upload failed')};
            x.send(file);
          }
          $('file').addEventListener('change',e=>{upload(e.target.files[0]);e.target.value=''});
          (function(){
            const dz=$('drop');
            ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
            ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
            dz.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)upload(f)});
          })();
          function installUrl(){
            const u=val('appurl').trim();
            if(!u){toast('Paste a link first');return}
            $('upmsg').textContent='Downloading and installing... large files take a while';
            post('/installurl',{url:u,launch:$('launchafter').checked});
          }

          // ---- Stream-only modes ----
          // fs   : real browser Fullscreen API (desktop, Android, iPad). Esc / system gesture leaves it.
          // fill : page-fill mode for browsers without the Fullscreen API.
          const stageEl=$('stage'),rootEl=document.documentElement;
          let wl=null;
          async function keepAwake(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}}
          document.addEventListener('visibilitychange',()=>{if(mode&&!document.hidden)keepAwake()});
          function fit(){
            if(!mode){cv.style.width='';cv.style.height='';return}
            const W=stageEl.clientWidth,H=stageEl.clientHeight;
            if(!W||!H||!cv.width||!cv.height)return;
            const s=Math.min(W/cv.width,H/cv.height);
            cv.style.width=Math.floor(cv.width*s)+'px';cv.style.height=Math.floor(cv.height*s)+'px';
          }
          new ResizeObserver(fit).observe(stageEl);
          addEventListener('resize',fit);
          addEventListener('orientationchange',()=>setTimeout(fit,250));
          function setMode(m){
            mode=m;
            rootEl.classList.toggle('fs',m==='fs');
            rootEl.classList.toggle('fill',m==='fill');
            fit();
            if(m){keepAwake();scrollTo(0,0)}
          }
          const canFS=!!(rootEl.requestFullscreen||rootEl.webkitRequestFullscreen);
          if(!canFS)$('fsbtn').style.display='none';
          async function goFS(){
            try{
              if(rootEl.requestFullscreen)await rootEl.requestFullscreen({navigationUI:'hide'});
              else await rootEl.webkitRequestFullscreen();
              if(actx&&actx.state==='suspended')actx.resume();
            }catch(e){toast('fullscreen: '+(e&&e.message||e))}
          }
          function fsChange(){
            if(mode==='fill')return;
            setMode((document.fullscreenElement||document.webkitFullscreenElement)?'fs':null);
          }
          document.addEventListener('fullscreenchange',fsChange);
          document.addEventListener('webkitfullscreenchange',fsChange);
          function goFill(){
            if(mode==='fill')return;
            setMode('fill');
            if(actx&&actx.state==='suspended')actx.resume();
          }
          function exitStream(){
            if(document.fullscreenElement||document.webkitFullscreenElement){
              const leave=document.exitFullscreen||document.webkitExitFullscreen;
              if(leave)Promise.resolve(leave.call(document)).catch(()=>setMode(null));
            }else setMode(null);
          }
          document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mode)exitStream()});
          document.addEventListener('contextmenu',e=>{if(mode)e.preventDefault()});
          document.addEventListener('gesturestart',e=>{if(mode)e.preventDefault()});

          // ---- Device orientation: the simulator follows how you hold your phone ----
          // Android/desktop browsers start it immediately; iOS only allows the permission prompt from a tap,
          // so there it appears on your first touch. Flip ORI_FLIP if it rotates the wrong way.
          const ORI_FLIP=false,hasOri=('DeviceOrientationEvent' in window)&&matchMedia('(pointer:coarse)').matches;
          let oriOn=false,oriWant=0,oriSent=0,oriTimer=null,oriAsked=false;
          function setOriBtn(){const b=$('oribtn');b.textContent=oriOn?'Tilt on':'Tilt off';b.classList.toggle('on',oriOn)}
          function oriHandle(e){
            const b=e.beta,g=e.gamma;
            if(b==null||g==null)return;
            let w=oriWant;
            if(Math.abs(g)>55&&Math.abs(b)<45)w=g>0?1:3;
            else if(Math.abs(b)>50&&Math.abs(g)<35)w=0;
            if(w===oriWant)return;
            oriWant=w;clearTimeout(oriTimer);
            oriTimer=setTimeout(()=>{if(oriWant!==oriSent){oriSent=oriWant;post('/orient',{v:ORI_FLIP?(4-oriWant)%4:oriWant})}},500);
          }
          async function oriStart(gesture){
            if(oriOn||!hasOri)return;
            try{
              const D=window.DeviceOrientationEvent;
              if(typeof D.requestPermission==='function'){
                oriAsked=true;
                const r=await D.requestPermission();
                if(r!=='granted'){toast('orientation permission denied');return}
              }
              addEventListener('deviceorientation',oriHandle);
              oriOn=true;setOriBtn();toast('device orientation on');
            }catch(e){
              if(gesture)toast('orientation: '+(e&&e.message||e));
              else if(!oriAsked&&typeof window.DeviceOrientationEvent.requestPermission==='function')oriAsked=false;
            }
          }
          function toggleOri(){
            if(oriOn){removeEventListener('deviceorientation',oriHandle);oriOn=false;setOriBtn();return}
            oriStart(true);
          }
          if(hasOri){
            $('oribtn').style.display='';
            oriStart(false);
            if(typeof window.DeviceOrientationEvent.requestPermission==='function'){
              const first=()=>{if(!oriOn&&!oriAsked)oriStart(true);if(oriOn||oriAsked)['touchend','pointerup'].forEach(ev=>document.removeEventListener(ev,first))};
              ['touchend','pointerup'].forEach(ev=>document.addEventListener(ev,first));
            }
          }

          loadApps();
          </script></body></html>'''


          async def main():
              app = web.Application()
              app.add_routes([web.get("/", index), web.get("/ws", ws_handler), web.get("/wsa", ws_audio), web.get("/wsm", ws_mic), web.get("/apps", apps_handler), web.post("/install", install_upload), web.get("/shot.png", shot)])
              runner = web.AppRunner(app, access_log=None)
              await runner.setup()
              await web.TCPSite(runner, "127.0.0.1", PORT).start()
              asyncio.create_task(capture())
              asyncio.create_task(init_native())
              asyncio.create_task(hid_pump())
              asyncio.create_task(springboard_watch())
              _loop = asyncio.get_running_loop()
              _loop.run_in_executor(POOL, audio_boot, _loop)
              _loop.run_in_executor(POOL, lambda: _warm())
              await STOP_EV.wait()
              await asyncio.sleep(0.5)
              await runner.cleanup()


          def _warm():
              try:
                  points()
              except Exception as e:
                  log("could not read screen size yet:", e)


          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF
          python3 -m py_compile server.py && echo "server.py OK"

      - name: Start session and print the link
        run: |
          export TOKEN=$(openssl rand -hex 12)
          export PORT=8080
          export FPS=30
          export GRPC_PORT=10882
          if [ "${MINUTES:-0}" -gt 340 ] 2>/dev/null; then MINUTES=340; fi

          command -v cloudflared >/dev/null || { echo "cloudflared missing, cannot create the web link"; exit 1; }

          if [ "$AUDIO" = "true" ] && command -v SwitchAudioSource >/dev/null; then
            SwitchAudioSource -s "BlackHole 2ch" -t output || true
            SwitchAudioSource -s "BlackHole 16ch" -t input || true
            echo "Default output: $(SwitchAudioSource -c -t output) / input: $(SwitchAudioSource -c -t input)"
          fi

          if command -v idb_companion >/dev/null && command -v idb >/dev/null; then
            # Supervised: if the companion ever exits (SpringBoard restart, framebuffer reset) it comes straight back.
            nohup bash -c 'while true; do idb_companion --udid "$UDID" --grpc-port "$GRPC_PORT" >> companion.log 2>&1; echo "idb_companion exited, restarting" >> companion.log; sleep 1; done' > /dev/null 2>&1 &
            sleep 6
            idb connect localhost "$GRPC_PORT" || true
            echo "--- idb self-test (failures here mean touch input won't work) ---"
            idb ui tap 100 100 --udid "$UDID" || echo "idb tap FAILED"
            idb ui button HOME --udid "$UDID" || echo "idb button FAILED"
          else
            echo "idb / idb_companion missing: slow screenshot fallback, no touch input"
          fi

          rm -f "$HOME"/xcbtn.cmd "$HOME"/xcbtn.ready "$HOME"/xcbtn.result "$HOME"/xcbtn.running
          csrutil status || true
          XR=$(ls bridge/build/Build/Products/*.xctestrun 2>/dev/null | head -1 || true)
          if [ -n "$XR" ]; then
            touch "$HOME/xcbtn.running"
            XR="$XR" UDID="$UDID" nohup bash -c 'while true; do xcodebuild test-without-building -xctestrun "$XR" -destination "id=$UDID" >> bridge.log 2>&1; rm -f "$HOME/xcbtn.ready"; sleep 2; done' > /dev/null 2>&1 &
            for i in $(seq 1 45); do [ -f "$HOME/xcbtn.ready" ] && break; sleep 2; done
            if [ -f "$HOME/xcbtn.ready" ]; then echo "button bridge ready"; else echo "button bridge NOT ready:"; tail -40 bridge.log; fi
          else
            echo "button bridge was not built: Action button / Ask Siri unavailable"
          fi

          if command -v simpod >/dev/null; then
            simpod --detach -q || echo "simpod failed to start: volume/rotate unavailable"
            sleep 3
            simpod --list -q || true
          else
            echo "simpod not installed: rotation fallback unavailable"
          fi

          cat > allow.sh <<'SH'
          #!/bin/bash
          while true; do
            osascript <<'AS' >> allow.log 2>&1
          tell application "System Events"
            repeat with pn in {"UserNotificationCenter", "CoreServicesUIAgent", "SecurityAgent"}
              if exists process pn then
                tell process pn
                  repeat with w in windows
                    repeat with bn in {"Allow", "Allow Always", "OK"}
                      if exists button bn of w then click button bn of w
                    end repeat
                  end repeat
                end tell
              end if
            end repeat
          end tell
          AS
            sleep 2
          done
          SH
          chmod +x allow.sh
          if [ "$AUDIO" = "true" ]; then nohup ./allow.sh > /dev/null 2>&1 & fi

          nohup python3 server.py > server.log 2>&1 &
          SERVER_PID=$!
          sleep 4
          curl -fsS "http://127.0.0.1:$PORT/?key=$TOKEN" -o /dev/null || { cat server.log; exit 1; }
          tail -n +1 -f server.log &

          nohup cloudflared tunnel --url "http://127.0.0.1:$PORT" --no-autoupdate --protocol http2 > cf.log 2>&1 &
          CF_PID=$!
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then cat cf.log; exit 1; fi

          FULL="$URL/?key=$TOKEN"
          echo "::notice title=Simulator link::$FULL"
          {
            echo "## iOS $VER simulator is live"
            echo
            echo "$FULL"
            echo
            echo "Anyone with this link can control the simulator. It ends in $MINUTES minutes or when you press Stop session."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "OPEN THIS: $FULL"

          END=$((SECONDS + MINUTES * 60))
          while kill -0 "$SERVER_PID" 2>/dev/null && [ "$SECONDS" -lt "$END" ]; do sleep 5; done

          kill "$SERVER_PID" "$CF_PID" 2>/dev/null || true
          xcrun simctl shutdown "$UDID" || true
          echo "Session ended."
