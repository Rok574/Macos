                    <div class="grid g2"><button onclick="post('/fontsize',{dir:'decrement'})">Text smaller</button><button onclick="post('/fontsize',{dir:'increment'})">Text larger</button></div>
                    <div class="grid g2"><button onclick="post('/contrast',{on:true})">Contrast on</button><button onclick="post('/contrast',{on:false})">Contrast off</button></div>
                  </div>
                  <div class="card"><h3>Face ID</h3>
                    <div class="grid g2">
                      <button onclick="post('/faceid',{mode:'enroll'})">Enrolled</button><button onclick="post('/faceid',{mode:'unenroll'})">Not enrolled</button>
                      <button onclick="post('/faceid',{mode:'match'})">Match</button><button onclick="post('/faceid',{mode:'nomatch'})">No match</button>
                    </div>
                  </div>
                  <div class="card"><h3>Location</h3>
                    <div class="grid g2"><input id="lat" placeholder="Latitude" inputmode="decimal"><input id="lon" placeholder="Longitude" inputmode="decimal"></div>
                    <div class="grid g2"><button onclick="post('/loc',{lat:val('lat'),lon:val('lon')})">Set</button><button onclick="post('/locclear',{})">Clear</button></div>
                    <div class="grid g3">
                      <button class="sm" onclick="post('/locrun',{name:'City Run'})">City run</button>
                      <button class="sm" onclick="post('/locrun',{name:'City Bicycle Ride'})">Bike ride</button>
                      <button class="sm" onclick="post('/locrun',{name:'Freeway Drive'})">Freeway</button>
                    </div>
                  </div>
                  <div class="card"><h3>System</h3>
                    <div class="grid g2"><button onclick="post('/icloud',{})">iCloud sync</button><button class="danger" onclick="post('/keychain',{})">Reset keychain</button></div>
                  </div>
