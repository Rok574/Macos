          const tt=document.getElementById('toast'),fpsEl=document.getElementById('fps');
          function val(i){return document.getElementById(i).value}
          let conN=0,conUnread=0;
          function toast(m){
            const box=document.getElementById('conlog');
            if(conN===0)box.textContent='';
            conN++;
            const d=new Date(),p=n=>String(n).padStart(2,'0');
            const line=document.createElement('div');
            line.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'  '+m;
            box.appendChild(line);
            while(box.childNodes.length>200)box.removeChild(box.firstChild);
            box.scrollTop=box.scrollHeight;
            if(!document.getElementById('p-console').classList.contains('on')){conUnread++;document.getElementById('contab').textContent='Console ('+conUnread+')'}
          }
          function conClear(){const b=document.getElementById('conlog');b.textContent='';conN=0}
          let ws=null,stopped=false,retry=0;
          function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else toast('not connected')}
          function ack(){if(ws&&ws.readyState===1)ws.send('{"t":"ack"}')}
          function post(p,b){send(Object.assign({t:p.slice(1)},b||{}))}
