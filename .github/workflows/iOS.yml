              }else{
                const node=mctx.createScriptProcessor(4096,1,1);
                node.onaudioprocess=e=>out(toPcm16(e.inputBuffer.getChannelData(0)));
                src.connect(node);node.connect(mute);
              }
              mute.connect(mctx.destination);
              mon=true;setMBtn();mconnect();toast('microphone on');
            }catch(err){toast('mic: '+(err&&err.message||err));micOff()}
          }
          function micOff(){
            mon=false;
            if(mws){try{mws.close()}catch(e){}}mws=null;
            if(mstream){mstream.getTracks().forEach(t=>t.stop())}mstream=null;
            if(mctx){try{mctx.close()}catch(e){}}mctx=null;
