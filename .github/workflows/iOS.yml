                      <select id="sb_cm"><option value="active">Active</option><option value="searching">Searching</option><option value="failed">Failed</option><option value="notSupported">No cellular</option></select>
                      <select id="sb_net"><option>wifi</option><option>hide</option><option>3g</option><option>4g</option><option selected>lte</option><option>lte-a</option><option>lte+</option><option>5g</option><option>5g+</option><option>5g-uwb</option><option>5g-uc</option></select>
                    </div>
                    <label class="f">Bars <b id="sb_cb_v">4</b></label>
                    <input id="sb_cb" type="range" min="0" max="4" value="4" oninput="sbv(this)">
                  </div>
                  <div class="card"><h3>Wi-Fi</h3>
                    <select id="sb_wm"><option value="active">Active</option><option value="searching">Searching</option><option value="failed">Failed</option></select>
                    <label class="f">Bars <b id="sb_wb_v">3</b></label>
                    <input id="sb_wb" type="range" min="0" max="3" value="3" oninput="sbv(this)">
                  </div>
                  <div class="card"><h3>Battery</h3>
                    <label class="f">Level <b id="sb_bl_v">100</b></label>
                    <input id="sb_bl" type="range" min="0" max="100" value="100" oninput="sbv(this)">
                    <select id="sb_bs"><option value="discharging">Discharging</option><option value="charging">Charging</option><option value="charged">Charged</option></select>
                  </div>
                  <div class="grid g2"><button class="primary" onclick="sbApply()">Apply</button><button onclick="post('/statusbar',{mode:'clear'})">Reset</button></div>
                </div>

                <div class="pane" id="p-session">
                  <div class="card"><h3>Sound</h3>
                    <label class="f">Playback volume</label>
                    <input id="vol" type="range" min="0" max="100" value="100" oninput="setVol(this.value)">
                    <small>Use the Sound and Mic buttons at the top to switch them on or off.</small>
                  </div>
                  <div class="card"><h3>Video stream</h3>
                    <div class="grid g3">
                      <button class="sm" onclick="preset(20,0.35,0.45)">Fast</button>
                      <button class="sm" onclick="preset(30,0.5,0.6)">Balanced</button>
                      <button class="sm" onclick="preset(30,0.75,0.8)">Sharp</button>
                    </div>
                    <label class="f">Frames per second <b id="st_fps_v">30</b></label>
                    <input id="st_fps" type="range" min="5" max="60" value="30" oninput="sbv(this)">
                    <label class="f">Size <b id="st_scale_v">0.5</b></label>
                    <input id="st_scale" type="range" min="0.2" max="1" step="0.05" value="0.5" oninput="sbv(this)">
                    <label class="f">Quality <b id="st_quality_v">0.6</b></label>
                    <input id="st_quality" type="range" min="0.2" max="1" step="0.05" value="0.6" oninput="sbv(this)">
                    <button class="primary" onclick="applyStream()">Apply</button>
                    <small>Lower values are faster but blurrier. The top bar shows live fps and KB/s so you can see if the link is the limit.</small>
                  </div>
                  <div class="card"><h3>Capture</h3>
                    <button onclick="location.href='/shot.png'">Save screenshot</button>
                  </div>
                  <div class="card"><h3>Session</h3>
                    <button class="danger" onclick="if(confirm('Stop the session?'))post('/stop',{})">Stop session</button>
                  </div>
                </div>
                <div class="pane" id="p-console">
                  <div class="card"><h3>Console</h3>
                    <div id="clog"></div>
                    <div class="grid g2"><button onclick="document.getElementById('clog').textContent=''">Clear</button><button onclick="navigator.clipboard&amp;&amp;navigator.clipboard.writeText(document.getElementById('clog').innerText)">Copy</button></div>
                  </div>
                </div>
              </aside>
            </main>
          </div>
          <button id="fillExit" type="button" onclick="exitStream()">Exit view</button>
          <div id="toast"></div>
          <script>
          const SIM_DEVICE_NAME=__DEVICE_NAME_JSON__;
          const ACTION_BUTTON_SUPPORTED=/(iPhone 15 Pro|iPhone 16|iPhone 17|iPhone 18|iPhone Air)/i.test(SIM_DEVICE_NAME);
          const cv=document.getElementById('cv'),scr=document.getElementById('scr');
          const ctx=cv.getContext('2d',{alpha:false,desynchronized:true});
          const tt=document.getElementById('toast'),fpsEl=document.getElementById('fps');
          function val(i){return document.getElementById(i).value}
          let unread=0,mode=null,rx=0;
          function toast(m){
            const box=document.getElementById('clog');if(!box)return;
            const d=new Date(),p=n=>String(n).padStart(2,'0');
            const line=document.createElement('div');
            line.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'  '+m;
            box.appendChild(line);
            while(box.childNodes.length>300)box.removeChild(box.firstChild);
            box.scrollTop=box.scrollHeight;
            if(!document.getElementById('p-console').classList.contains('on')){unread++;document.getElementById('cbadge').textContent=unread}
          }
          let ws=null,stopped=false,retry=0;
          function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else toast('not connected')}
          function ack(){if(ws&&ws.readyState===1)ws.send('{"t":"ack"}')}
          function post(p,b){send(Object.assign({t:p.slice(1)},b||{}))}
          function btn(n){post('/button',{name:n})}
          if(!ACTION_BUTTON_SUPPORTED){const a=document.getElementById('actionDockButton');a.hidden=true}
          function gest(x1,y1,x2,y2,d){post('/swipe',{x1:x1,y1:y1,x2:x2,y2:y2,dur:d})}
          function sendText(){post('/text',{text:val('txt')});document.getElementById('txt').value=''}

          let pending=null,busy=false,frames=0,lastT=performance.now();
          const BMOPT={premultiplyAlpha:'none',colorSpaceConversion:'none'};
          async function drain(){
            busy=true;
            while(pending){
              const b=pending;pending=null;
              try{
                let bm;
                try{bm=await createImageBitmap(b,BMOPT)}catch(e){bm=await createImageBitmap(b)}
                if(cv.width!==bm.width||cv.height!==bm.height){cv.width=bm.width;cv.height=bm.height;fit()}
                ctx.drawImage(bm,0,0);bm.close();
                frames++;
              }catch(e){}
              ack();
            }
            busy=false;
          }
          setInterval(()=>{const n=performance.now();if(!mode&&!document.hidden)fpsEl.textContent=(frames*1000/(n-lastT)).toFixed(1)+' fps · '+Math.round(rx/1024*1000/(n-lastT))+' KB/s';rx=0;frames=0;lastT=n},1000);

          function connect(){
            if(stopped||(ws&&ws.readyState<=1))return;
            ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
            ws.onopen=()=>{retry=0;setConn(true);toast('Connected');lastTz='';setTimeout(clockSync,300);if(document.hidden)ws.send('{"t":"pause","on":true}')};
            ws.onmessage=e=>{
              if(typeof e.data==='string'){
                const j=JSON.parse(e.data);
                if(j.t==='toast'){toast(j.msg);if(/^installed/i.test(j.msg)){$('upmsg').textContent=j.msg;loadApps()}else if(/^(download failed|no \.app|install failed|could not unpack|the link)/i.test(j.msg))$('upmsg').textContent=j.msg}
                else if(j.t==='stopped'){stopped=true;audioOff();micOff();toast('session stopped')}
                return;
              }
              if(pending)ack();
              rx+=e.data.size||0;pending=e.data;
              if(!busy)drain();
            };
            ws.onclose=()=>{
              if(stopped)return;
              setConn(false);toast('Reconnecting...');
              setTimeout(connect,Math.min(3000,300*Math.pow(1.6,retry++)));
            };
          }
          connect();
          document.addEventListener('visibilitychange',()=>{if(!document.hidden)connect();if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'pause',on:document.hidden}))});
          window.addEventListener('online',connect);

          let actx=null,aws=null,anext=0,arate=24000,ach=1,aon=false,gnode=null,pnode=null,volv=1;
          const abtn=document.getElementById('abtn');
          function setABtn(){abtn.textContent=aon?'Sound on':'Sound off';abtn.classList.toggle('on',aon)}
          function setVol(v){volv=v/100;if(gnode)gnode.gain.value=volv}
          function toggleAudio(){aon?audioOff():audioOn()}
          // Playback runs in an AudioWorklet ring buffer: no per-chunk AudioBuffer/node allocations on the main thread.
          const PLAY_WORKLET=`class Q extends AudioWorkletProcessor{
          constructor(){super();this.cap=0;this.L=null;this.R=null;this.w=0;this.rp=0;this.step=0.5;this.ch=1;this.on=false;this.prime=0;
          this.port.onmessage=e=>{const d=e.data;
          if(d.fmt){this.ch=d.fmt.ch;this.cap=Math.ceil(d.fmt.rate*1.5);this.L=new Float32Array(this.cap);this.R=new Float32Array(this.cap);this.w=0;this.rp=0;this.on=false;this.step=d.fmt.rate/sampleRate;this.prime=Math.ceil(d.fmt.rate*0.07);return}
          if(d.flush){this.w=0;this.rp=0;this.on=false;return}
          if(!this.L)return;
          const i16=new Int16Array(d),ch=this.ch,n=Math.floor(i16.length/ch);
          for(let i=0;i<n;i++){const k=(this.w+i)%this.cap;this.L[k]=i16[i*ch]/32768;this.R[k]=ch>1?i16[i*ch+1]/32768:this.L[k]}
          this.w+=n;
          if(this.w-this.rp>this.cap*0.6)this.rp=this.w-this.prime}}
          process(_,o){const out=o[0],a=out[0],b=out[1]||a;
          if(!this.L)return true;
          if(!this.on){if(this.w-this.rp<this.prime)return true;this.on=true}
          for(let i=0;i<a.length;i++){
          if(this.w-this.rp<2){this.on=false;break}
          const p=this.rp,j=Math.floor(p),f=p-j,k=j%this.cap,k2=(j+1)%this.cap;
          a[i]=this.L[k]*(1-f)+this.L[k2]*f;b[i]=this.R[k]*(1-f)+this.R[k2]*f;
          this.rp+=this.step}
          return true}}
          registerProcessor('pcmplay',Q)`;
          async function audioOn(){
            if(aon)return;
            aon=true;setABtn();
            actx=actx||new (window.AudioContext||window.webkitAudioContext)({latencyHint:'balanced'});
            if(!gnode){gnode=actx.createGain();gnode.gain.value=volv;gnode.connect(actx.destination)}
            if(!pnode&&actx.audioWorklet&&window.AudioWorkletNode){
              try{
                await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([PLAY_WORKLET],{type:'application/javascript'})));
                pnode=new AudioWorkletNode(actx,'pcmplay',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
                pnode.connect(gnode);
              }catch(e){pnode=null;toast('audio worklet unavailable, using fallback')}
            }
            actx.resume();
            if(aon)aconnect();
          }
          function audioOff(){aon=false;if(aws){try{aws.close()}catch(e){}}aws=null;if(pnode)pnode.port.postMessage({flush:true});setABtn()}
          function aconnect(){
            if(!aon||stopped)return;
            aws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/wsa');
            aws.binaryType='arraybuffer';
            aws.onmessage=e=>{
              if(typeof e.data==='string'){
                const j=JSON.parse(e.data);
                if(j.t==='fmt'){arate=j.rate;ach=j.ch;if(pnode)pnode.port.postMessage({fmt:{rate:arate,ch:ach}});if(!j.ok){toast('audio not available on server');audioOff()}}
                return;
              }
              play(e.data);
            };
            aws.onclose=()=>{if(aon&&!stopped)setTimeout(aconnect,1000)};
          }
          function play(buf){
            if(!actx||buf.byteLength<2)return;
            if(pnode){pnode.port.postMessage(buf,[buf]);return}
            const i16=new Int16Array(buf,0,Math.floor(buf.byteLength/2)),n=Math.floor(i16.length/ach);
            if(!n)return;
            const ab=actx.createBuffer(ach,n,arate);
            for(let c=0;c<ach;c++){const d=ab.getChannelData(c);for(let i=0;i<n;i++)d[i]=i16[i*ach+c]/32768}
            const now=actx.currentTime;
            if(anext<now+0.02)anext=now+0.08;
            else if(anext>now+0.5)return;
            const s=actx.createBufferSource();s.buffer=ab;s.connect(gnode);s.start(anext);anext+=ab.duration;
          }

          let syncOn=false,batt=null,sbTimer=null,sbDeb=null;
          const $=id=>document.getElementById(id);
          function sbv(el){$(el.id+'_v').textContent=el.value}
          function setv(id,v){$(id).value=v;if($(id+'_v'))$(id+'_v').textContent=v}
          function isoNow(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
          let clockOn=true,lastTz='';
          function clockSync(){
            if(!clockOn||!ws||ws.readyState!==1)return;
            let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
            if(tz&&tz!==lastTz){lastTz=tz;post('/tz',{name:tz})}
            post('/statusbar',{mode:'set',time:isoNow()});
          }
          function toggleClock(){clockOn=!clockOn;lastTz='';$('clocksync').textContent='Clock and time zone from this device: '+(clockOn?'on':'off');if(clockOn)clockSync()}
          (function tick(){setTimeout(()=>{clockSync();tick()},60000-(Date.now()%60000)+150)})();
          function sbVals(){return{mode:'set',time:clockOn?isoNow():val('sb_time'),op:val('sb_op'),cm:val('sb_cm'),cb:+val('sb_cb'),net:val('sb_net'),wm:val('sb_wm'),wb:+val('sb_wb'),bl:+val('sb_bl'),bs:val('sb_bs')}}
          function sbApply(){post('/statusbar',sbVals())}
          function applyStream(){post('/stream',{fps:+val('st_fps'),scale:+val('st_scale'),quality:+val('st_quality')})}
          function preset(f,s,q){setv('st_fps',f);setv('st_scale',s);setv('st_quality',q);applyStream()}
          function sbPull(){
            const d=new Date(),h=d.getHours()%12||12;
            $('sb_time').value=h+':'+String(d.getMinutes()).padStart(2,'0');
            let info=[];
            if(batt){
              const pct=Math.round(batt.level*100);
              setv('sb_bl',pct);
              $('sb_bs').value=batt.charging?(pct>=100?'charged':'charging'):'discharging';
              info.push('battery '+pct+'%'+(batt.charging?' (charging)':''));
            }
            const c=navigator.connection;
            if(c){
              const bars=(max)=>{const r=c.rtt;if(r==null||r===0)return max;return r<60?max:r<150?Math.max(1,max-1):r<400?Math.max(1,max-2):0};
              if(c.type==='wifi'||c.type==='ethernet'){
                $('sb_net').value='wifi';$('sb_wm').value='active';setv('sb_wb',bars(3));
              }else if(c.type==='cellular'){
                $('sb_cm').value='active';setv('sb_cb',bars(4));
                $('sb_net').value=({'slow-2g':'3g','2g':'3g','3g':'3g','4g':'lte'})[c.effectiveType]||'lte';
              }else{
                setv('sb_wb',bars(3));
              }
              info.push((c.type||c.effectiveType||'net')+(c.rtt!=null?', rtt '+c.rtt+' ms':''));
            }
            $('sbdev').textContent=info.length?'This device: '+info.join(' / '):'Battery/network info is not exposed by this browser';
          }
          function sbSync(){
            if(!syncOn)return;
            sbPull();clearTimeout(sbDeb);sbDeb=setTimeout(sbApply,400);
          }
          async function toggleSync(){
            const b=$('sbsync');
            if(syncOn){syncOn=false;clearInterval(sbTimer);b.textContent='Sync from this device: off';return}
            syncOn=true;b.textContent='Sync from this device: on';
            if(navigator.getBattery){
              try{batt=await navigator.getBattery();['levelchange','chargingchange'].forEach(ev=>batt.addEventListener(ev,sbSync))}catch(e){}
            }else toast('Battery API is only in Chrome/Edge/Android browsers; the slider value is used instead');
            if(navigator.connection)navigator.connection.addEventListener('change',sbSync);
            sbTimer=setInterval(sbSync,30000);
            sbSync();
          }

          let mctx=null,mws=null,mstream=null,mon=false;
          const mbtn=document.getElementById('mbtn');
          const MIC_WORKLET=`class P extends AudioWorkletProcessor{constructor(o){super();this.k=(o&&o.processorOptions&&o.processorOptions.chunk)||320;this.b=[];this.n=0}
          process(i){const c=i[0]&&i[0][0];if(c){this.b.push(new Float32Array(c));this.n+=c.length;
          if(this.n>=this.k){const o=new Int16Array(this.n);let k=0;for(const a of this.b)for(let j=0;j<a.length;j++){const v=Math.max(-1,Math.min(1,a[j]));o[k++]=v<0?v*32768:v*32767}
          this.port.postMessage(o.buffer,[o.buffer]);this.b=[];this.n=0}}return true}}
          registerProcessor('mic',P)`;
          let mlvl=0;
          function setMBtn(){mbtn.textContent=mon?'Mic on '+mlvl+'%':'Mic off';mbtn.classList.toggle('on',mon)}
          function toggleMic(){mon?micOff():micOn()}
          function mconnect(){
            if(!mon||stopped)return;
            mws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/wsm');
            mws.onopen=()=>{if(mctx)mws.send(JSON.stringify({t:'fmt',rate:mctx.sampleRate}))};
            mws.onmessage=e=>{
              if(typeof e.data!=='string')return;
              const j=JSON.parse(e.data);
              if(j.t==='fmt'&&!j.ok){toast('microphone not available on server'+(j.err?': '+j.err:''));micOff()}
              else if(j.t==='lvl'){mlvl=j.v;setMBtn()}
            };
            mws.onclose=()=>{if(mon&&!stopped)setTimeout(mconnect,1000)};
          }
          function toPcm16(f){
            const o=new Int16Array(f.length);
            for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));o[i]=v<0?v*32768:v*32767}
            return o.buffer;
          }
          async function micOn(){
            if(mon)return;
            try{
              if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('needs a secure (https) page');
              mstream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
              const AC=window.AudioContext||window.webkitAudioContext;
              mctx=new AC({latencyHint:'interactive'});
              await mctx.resume();
              const src=mctx.createMediaStreamSource(mstream),mute=mctx.createGain();
              mute.gain.value=0;
              const out=buf=>{if(mws&&mws.readyState===1)mws.send(buf)};
              if(mctx.audioWorklet&&window.AudioWorkletNode){
                await mctx.audioWorklet.addModule(URL.createObjectURL(new Blob([MIC_WORKLET],{type:'application/javascript'})));
                const node=new AudioWorkletNode(mctx,'mic',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1],processorOptions:{chunk:Math.round(mctx.sampleRate/50)}});
                node.port.onmessage=e=>out(e.data);
