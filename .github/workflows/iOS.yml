                    <button id="sbsync" onclick="toggleSync()">Sync from this device: off</button>
                    <div class="muted" id="sbdev">Copies your real battery, clock and connection quality into the status bar.</div>
                  </div>
                  <div class="card"><h3>Time and carrier</h3>
