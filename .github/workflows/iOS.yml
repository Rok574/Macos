name: Remote iOS 26.5 Simulator

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'iOS version (if it is not available, the newest installed iOS is used)'
        default: '26.5'
        required: true
      device:
        description: 'Device model (if the iOS version does not support it, an iPhone it does support is used)'
        default: 'iPhone 17 Pro'
        required: true
      scale:
        description: 'Video scale factor (0.3 - 1.0). Lower = faster, blurrier.'
        default: '0.5'
        required: true
      quality:
        description: 'JPEG quality (0.2 - 1.0). Lower = faster, blockier.'
        default: '0.6'
        required: true
      audio:
        description: 'Stream simulator audio + microphone (installs virtual audio devices)'
        type: boolean
        default: true
      timezone:
        description: 'Time zone for the simulator (it follows the runner). Your phone updates it live once connected.'
        default: 'America/New_York'
        required: true

jobs:
  simulator:
    name: iOS ${{ inputs.version }} simulator
    runs-on: macos-26
    timeout-minutes: 355
    env:
      VER: ${{ inputs.version }}
      DEVICE: ${{ inputs.device }}
      MINUTES: '340'
      SCALE: ${{ inputs.scale }}
      QUALITY: ${{ inputs.quality }}
      AUDIO: ${{ inputs.audio }}
      TZNAME: ${{ inputs.timezone }}

    steps:
      - name: Select newest installed Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: Ensure the iOS runtime is installed
        run: |
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -q "iOS ${VER}"; then
            echo "Runtime not preinstalled, downloading (large, can take a while)..."
            xcodebuild -downloadPlatform iOS -buildVersion "${VER}" || echo "Download failed, will use the newest installed iOS instead"
          fi
          xcrun simctl list runtimes

      - name: Install virtual audio device and route output to it
        if: ${{ inputs.audio }}
        continue-on-error: true
        run: |
          brew install switchaudio-osx
          brew install --cask blackhole-2ch blackhole-16ch
          sudo killall coreaudiod || true
          for i in $(seq 1 20); do
            SwitchAudioSource -a -t output | grep -q "BlackHole 2ch" && \
            SwitchAudioSource -a -t input | grep -q "BlackHole 16ch" && break
            sleep 1
          done
          SwitchAudioSource -a
          SwitchAudioSource -s "BlackHole 2ch" -t output
          SwitchAudioSource -s "BlackHole 16ch" -t input
          echo "Default output: $(SwitchAudioSource -c -t output) / input: $(SwitchAudioSource -c -t input)"

      - name: Set runner time zone
        continue-on-error: true
        run: |
          sudo systemsetup -settimezone "$TZNAME" || sudo ln -sf "/var/db/timezone/zoneinfo/$TZNAME" /etc/localtime
          date

      - name: Grant microphone and automation permissions
        if: ${{ inputs.audio }}
        continue-on-error: true
        run: |
          csrutil status || true
          PYS=$(ls /Users/runner/hostedtoolcache/Python/*/*/bin/python3* 2>/dev/null | tr '\n' ' ')
          XC=$(xcode-select -p)
          APP="${XC%/Developer}"
          CLIENTS_BID="com.apple.Terminal com.apple.dt.Xcode com.apple.CoreSimulator.CoreSimulatorService com.apple.iphonesimulator com.apple.dt.SimulatorTrampoline com.apple.dt.xcodebuild com.apple.CoreSimulator.SimulatorTrampoline"
          CLIENTS_PATH="/bin/bash /bin/zsh /bin/sh /usr/bin/python3 /usr/bin/osascript /usr/bin/xcrun /usr/bin/xcodebuild /usr/sbin/sshd /usr/libexec/sshd-keygen-wrapper $APP/Contents/Developer/Applications/Simulator.app $APP/Contents/Developer/Applications/Simulator.app/Contents/MacOS/Simulator $APP/Contents/Developer/Library/PrivateFrameworks/CoreSimulator.framework/Versions/A/XPCServices/com.apple.CoreSimulator.CoreSimulatorService.xpc/Contents/MacOS/com.apple.CoreSimulator.CoreSimulatorService $(command -v dotnet || true) $(command -v python3 || true) $PYS"
          add() {
            db="$1"; svc="$2"; client="$3"; ctype="$4"; extra_t="${5:-0}"; extra_id="${6:-}"
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier_type,indirect_object_identifier,flags,last_modified) VALUES ('$svc','$client',$ctype,2,4,1,$extra_t,'${extra_id:-UNUSED}',0,strftime('%s','now'));" 2>&1 | head -2
          }
          for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
            [ -f "$db" ] || { echo "no TCC db at $db"; continue; }
            echo "== $db"
            for c in $CLIENTS_BID; do
              add "$db" kTCCServiceMicrophone "$c" 0
              add "$db" kTCCServiceAccessibility "$c" 0
            done
            for c in $CLIENTS_PATH; do
              [ -n "$c" ] || continue
              add "$db" kTCCServiceMicrophone "$c" 1
              add "$db" kTCCServiceAccessibility "$c" 1
              add "$db" kTCCServiceAppleEvents "$c" 1 0 com.apple.systemevents
            done
            sudo sqlite3 "$db" "SELECT service, client, auth_value FROM access WHERE service='kTCCServiceMicrophone';" | head -30
          done
          sudo killall tccd 2>/dev/null || true
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
          sleep 2

      - name: Create and boot the simulator
        run: |
          RT_ID=$(xcrun simctl list runtimes -j | jq -r --arg v "$VER" \
            '[.runtimes[] | select(.platform=="iOS" and .isAvailable==true and (.version|startswith($v)))][0].identifier // empty')
          if [ -z "$RT_ID" ]; then
            echo "iOS $VER is not available, using the newest installed iOS"
            RT_ID=$(xcrun simctl list runtimes -j | jq -r \
              '[.runtimes[] | select(.platform=="iOS" and .isAvailable==true)] | sort_by(.version | split(".") | map(tonumber? // 0)) | last | .identifier // empty')
          fi
          if [ -z "$RT_ID" ]; then echo "No iOS runtime is installed"; exit 1; fi
          echo "Runtime: $RT_ID"
          echo "Supported devices for this runtime:"
          xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" \
            '.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | "  - " + .name + " (" + .productFamily + ")"'

          DT=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" --arg n "$DEVICE" \
            '[.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | select(.name==$n)][0].identifier // empty')
          FAMILY=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" --arg n "$DEVICE" \
            '[.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | select(.name==$n)][0].productFamily // empty')
          if [ -z "$DT" ]; then
            echo "Device '$DEVICE' not supported, falling back to the first iPhone"
            DT=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" \
              '[.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | select(.productFamily=="iPhone")][0].identifier')
            FAMILY=iPhone
          fi
          UDID=$(xcrun simctl create "Remote-$VER" "$DT" "$RT_ID")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl privacy "$UDID" grant microphone || true
          xcrun simctl privacy "$UDID" grant siri || true
          xcrun simctl list devices | grep "$UDID"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cloudflared (tunnel)
        run: |
          brew install cloudflared
          cloudflared --version

      - name: Install idb (video + touch input)
        continue-on-error: true
        run: |
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pip install fb-idb
          idb --help | head -3

      - name: Install aiohttp (+ sounddevice for audio)
        run: |
          pip install aiohttp
          pip install sounddevice || echo "sounddevice failed: audio disabled"

      - name: Install simpod (volume buttons, rotation)
        continue-on-error: true
        run: |
          if ! command -v dart >/dev/null; then
            brew tap dart-lang/dart
            brew install dart
          fi
          dart pub global activate simpod
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          "$HOME/.pub-cache/bin/simpod" --help || true

      - name: Build XCUITest button bridge (Action button, volume, Ask Siri)
        continue-on-error: true
        run: |
          brew install xcodegen
          mkdir -p bridge/Host bridge/BridgeUITests
          cd bridge
          cat > project.yml <<'YML'
          name: Bridge
          options:
            bundleIdPrefix: dev.bridge
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              GENERATE_INFOPLIST_FILE: YES
              CODE_SIGNING_ALLOWED: NO
              CODE_SIGNING_REQUIRED: NO
              INFOPLIST_KEY_UILaunchScreen_Generation: YES
          targets:
            Host:
              type: application
              platform: iOS
              sources: [Host]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: dev.bridge.host
            BridgeUITests:
              type: bundle.ui-testing
              platform: iOS
              sources: [BridgeUITests]
              dependencies:
                - target: Host
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: dev.bridge.uitests
          schemes:
            Bridge:
              build:
                targets:
                  Host: all
                  BridgeUITests: [test]
              test:
                targets: [BridgeUITests]
          YML
          cat > Host/App.swift <<'SW'
          import SwiftUI
          @main struct HostApp: App { var body: some Scene { WindowGroup { Text("button bridge") } } }
          SW
          cat > BridgeUITests/ButtonBridge.swift <<'SW'
          import XCTest

          final class ButtonBridge: XCTestCase {
              @MainActor
              func setVolume(_ delta: Double) -> String {
                  let sb = XCUIApplication(bundleIdentifier: "com.apple.springboard")
                  let top = sb.coordinate(withNormalizedOffset: CGVector(dx: 0.95, dy: 0.0))
                  let mid = sb.coordinate(withNormalizedOffset: CGVector(dx: 0.95, dy: 0.5))
                  top.press(forDuration: 0.1, thenDragTo: mid)
                  Thread.sleep(forTimeInterval: 0.8)
                  let pred = NSPredicate(format: "label CONTAINS[c] 'volume' OR identifier CONTAINS[c] 'volume'")
                  let slider = sb.sliders.matching(pred).firstMatch
                  var result = "volume slider not found in Control Center"
                  if slider.waitForExistence(timeout: 2) {
                      var cur = 0.5
                      if let s = slider.value as? String, let n = Double(s.replacingOccurrences(of: "%", with: "")) { cur = n / 100 }
                      let next = min(1.0, max(0.0, cur + delta))
                      slider.adjust(toNormalizedSliderPosition: CGFloat(next))
                      result = "ok"
                  }
                  XCUIDevice.shared.press(.home)
                  return result
              }

              @MainActor
              func testLoop() throws {
                  continueAfterFailure = true
                  let home = ProcessInfo.processInfo.environment["SIMULATOR_HOST_HOME"] ?? NSHomeDirectory()
                  let cmd = home + "/xcbtn.cmd", ready = home + "/xcbtn.ready", out = home + "/xcbtn.result"
                  let fm = FileManager.default
                  fm.createFile(atPath: ready, contents: Data("1".utf8))
                  defer { try? fm.removeItem(atPath: ready) }
                  let device = XCUIDevice.shared
                  let end = Date().addingTimeInterval(6 * 3600)
                  while Date() < end {
                      if let data = fm.contents(atPath: cmd), let raw = String(data: data, encoding: .utf8) {
                          try? fm.removeItem(atPath: cmd)
                          let c = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                          var result = "ok"
                          if c == "action" {
                              if device.hasHardwareButton(.action) {
                                  device.press(.action)
                                  result = "ok"
                              } else {
                                  result = "unsupported: selected simulator does not expose an Action Button; choose a supported iPhone model (for example, iPhone 17 Pro)"
                              }
                          } else if c == "volume_up" {
                              result = self.setVolume(0.0625)
                          } else if c == "volume_down" {
                              result = self.setVolume(-0.0625)
                          } else if c.hasPrefix("siri:") {
                              device.siriService.activate(voiceRecognitionText: String(c.dropFirst(5)))
                          } else {
                              result = "unknown command"
                          }
                          fm.createFile(atPath: out, contents: Data(result.utf8))
                      }
                      Thread.sleep(forTimeInterval: 0.05)
                  }
              }
          }
          SW
          xcodegen generate
          xcodebuild build-for-testing -project Bridge.xcodeproj -scheme Bridge \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tail -40
          ls build/Build/Products/*.xctestrun

      - name: Write the web server
        run: |
          cat > server.py <<'PYEOF'
          import asyncio, hmac, json, logging, os, re, shutil, subprocess, sys, tempfile, threading, time
          import urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from contextlib import AsyncExitStack
          from aiohttp import web, WSMsgType

          UDID = os.environ["UDID"]
          TOKEN = os.environ["TOKEN"]
          PORT = int(os.environ.get("PORT", "8080"))
          GRPC_PORT = int(os.environ.get("GRPC_PORT", "10882"))
          IDB = os.environ.get("IDB", "idb")
          FPS = os.environ.get("FPS", "30")
          SCALE = os.environ.get("SCALE", "0.5")
          QUALITY = os.environ.get("QUALITY", "0.6")
          SCALE_H = int(os.environ.get("SCALE_H", "1100"))
          WINDOW = int(os.environ.get("WINDOW", "10"))
          STREAM = {"fps": FPS, "scale": SCALE, "quality": QUALITY, "gen": 0}
          PRESETS = {"fast": ("20", "0.35", "0.45"), "balanced": ("30", "0.5", "0.6"), "sharp": ("30", "0.75", "0.8")}

          FRAME = {"data": b"", "id": 0}
          MODE = {"v": "starting"}
          POINTS = {"v": None}
          NATIVE = {"c": None, "btn": None}
          COND = asyncio.Condition()
          STOP_EV = asyncio.Event()
          INPUT_LOCK = asyncio.Lock()
          POOL = ThreadPoolExecutor(max_workers=4)
          LOCK = threading.Lock()
          BG = set()

          AUDIO_DEVICE = os.environ.get("AUDIO_DEVICE", "BlackHole 2ch")
          AUDIO_RATE = int(os.environ.get("AUDIO_RATE", "24000"))
          AUDIO_CH = int(os.environ.get("AUDIO_CH", "1"))
          AUDIO = {"ok": False, "ch": 1}
          AUDIO_CLIENTS = set()


          def log(*a):
              print(*a, flush=True)


          def run(cmd, timeout=40, inp=None):
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, input=inp)
                  out = (r.stdout + r.stderr).strip()
                  return {"ok": r.returncode == 0, "msg": (out[:300] if out else "ok")}
              except FileNotFoundError:
                  return {"ok": False, "msg": "command not found: " + cmd[0]}
              except Exception as e:
                  return {"ok": False, "msg": str(e)}


          def idb(args):
              return run([IDB] + args + ["--udid", UDID])


          def points():
              if POINTS["v"]:
                  return POINTS["v"]
              out = subprocess.run([IDB, "describe", "--udid", UDID, "--json"],
                                   capture_output=True, text=True, timeout=25).stdout
              sd = json.loads(out)["screen_dimensions"]
              POINTS["v"] = (float(sd["width_points"]), float(sd["height_points"]))
              return POINTS["v"]


          SIMPOD = os.environ.get("SIMPOD", "simpod")
          BUNDLE_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]*$")
          SIM_BUTTONS = ("volume_up", "volume_down", "action")
          LOC_SCENARIOS = ("Freeway Drive", "City Run", "City Bicycle Ride")
          BAD = {"ok": False, "msg": "bad request"}


          def volume(name):
              short = name.replace("_", "-")
              last = None
              for a in (["button", name], ["button", short], [short], [name]):
                  r = simpod(a)
                  log("[volume] simpod", " ".join(a), "->", r["ok"], r["msg"][:120])
                  if r["ok"]:
                      return {"ok": True, "msg": "volume via simpod"}
                  last = r
              r = bridge(name, wait=12.0)
              if r is not None:
                  log("[volume] bridge ->", r)
                  return {"ok": r["ok"], "msg": ("volume via Control Center" if r["ok"] else r["msg"])}
              r = idb(["ui", "key", "128" if name == "volume_up" else "129"])
              return {"ok": r["ok"], "msg": "volume: only a keyboard key was sent (see log: simpod failed: %s)" % (last["msg"][:80] if last else "n/a")}


          def simpod(args):
              r = run([SIMPOD] + args + ["-d", UDID])
              if not r["ok"]:
                  r2 = run([SIMPOD] + args)
                  if r2["ok"]:
                      return r2
              return r


          def simctl(*args, inp=None):
              return run(["xcrun", "simctl"] + list(args), inp=inp)


          TZ_RE = re.compile(r"^[A-Za-z]+(?:/[A-Za-z0-9_+-]+){0,2}$")
          TZ_STATE = {"v": os.environ.get("TZNAME", "")}


          def set_tz(name):
              if name == TZ_STATE["v"]:
                  return {"ok": True, "msg": "ok"}
              if not TZ_RE.match(name) or not os.path.exists("/var/db/timezone/zoneinfo/" + name):
                  return {"ok": False, "msg": "unknown time zone " + name[:40]}
              r = run(["sudo", "-n", "systemsetup", "-settimezone", name])
              if not r["ok"] or "rror" in r["msg"]:
                  r = run(["sudo", "-n", "ln", "-sf", "/var/db/timezone/zoneinfo/" + name, "/etc/localtime"])
              if r["ok"]:
                  TZ_STATE["v"] = name
                  simctl("spawn", UDID, "notifyutil", "-p", "com.apple.system.timezone")
                  return {"ok": True, "msg": "time zone " + name}
              return {"ok": False, "msg": "time zone change failed: " + r["msg"][:100]}


          def notify(name):
              return simctl("spawn", UDID, "notifyutil", "-p", name)


          HOME = os.path.expanduser("~")
          BR_CMD, BR_READY, BR_OUT, BR_RUNNING = (os.path.join(HOME, n) for n in ("xcbtn.cmd", "xcbtn.ready", "xcbtn.result", "xcbtn.running"))


          def bridge(cmd, wait=5.0):
              for _ in range(120):
                  if os.path.exists(BR_READY) or not os.path.exists(BR_RUNNING):
                      break
                  time.sleep(0.25)
              if not os.path.exists(BR_READY):
                  return None
              try:
                  if os.path.exists(BR_OUT):
                      os.unlink(BR_OUT)
                  with open(BR_CMD + ".tmp", "w") as f:
                      f.write(cmd)
                  os.replace(BR_CMD + ".tmp", BR_CMD)
              except Exception as e:
                  return {"ok": False, "msg": "bridge write failed: %s" % e}
              t0 = time.time()
              while time.time() - t0 < wait:
                  if not os.path.exists(BR_CMD) and os.path.exists(BR_OUT):
                      try:
                          msg = open(BR_OUT).read().strip() or "ok"
                      except Exception:
                          msg = "ok"
                      return {"ok": msg == "ok", "msg": msg}
                  time.sleep(0.05)
              return {"ok": False, "msg": "bridge timed out"}


          def siri_diag():
              t0 = time.time()
              time.sleep(8)
              d = os.path.expanduser("~/Library/Logs/DiagnosticReports")
              found = False
              try:
                  for f in sorted(os.listdir(d)):
                      p = os.path.join(d, f)
                      if f.lower().startswith(("springboard", "assistantd", "siri")) and os.path.getmtime(p) > t0 - 5:
                          found = True
                          log("[siri-diag] crash report:", f)
                          n = 0
                          for line in open(p, errors="replace"):
                              if any(k in line.lower() for k in ("exception", "termination", "reason", "abort", "assert")):
                                  log("[siri-diag]  ", line.strip()[:240])
                                  n += 1
                                  if n >= 12:
                                      break
              except Exception as e:
                  log("[siri-diag] could not read crash reports:", e)
              if not found:
                  log("[siri-diag] no SpringBoard/assistant crash report found")
              try:
                  r = subprocess.run(["xcrun", "simctl", "spawn", UDID, "log", "show", "--last", "20s", "--style", "compact",
                                      "--predicate", 'process == "SpringBoard" OR process == "assistantd"'],
                                     capture_output=True, text=True, timeout=60)
                  n = 0
                  for line in r.stdout.splitlines():
                      if any(k in line.lower() for k in ("error", "fault", "crash", "audio", "input device", "microphone")):
                          log("[siri-diag]", line[:260])
                          n += 1
                          if n >= 25:
                              break
              except Exception as e:
                  log("[siri-diag] log show failed:", e)


          def extra(b):
              t = b.get("t")
              if t == "simbtn":
                  name = b.get("name")
                  if name not in SIM_BUTTONS:
                      return BAD
                  if name != "action":
                      return volume(name)
                  r = bridge(name)
                  if r is not None:
                      return r
                  return {"ok": False, "msg": "Action button needs the XCUITest bridge (it did not start; see bridge.log)"}
              if t == "siri":
                  text = str(b.get("text", "")).strip()[:200]
                  if not text:
                      return {"ok": False, "msg": "type what to ask Siri"}
                  r = bridge("siri:" + text, wait=15.0)
                  return r if r is not None else {"ok": False, "msg": "Ask Siri needs the XCUITest bridge"}
              if t == "rotate":
                  r = simpod(["rotate-left" if b.get("dir") == "left" else "rotate-right"])
                  POINTS["v"] = None
                  return r
              if t == "tz":
                  return set_tz(str(b.get("name", "")))
              if t == "shake":
                  return notify("com.apple.UIKit.SimulatorShake")
              if t == "faceid":
                  m = b.get("mode")
                  if m in ("enroll", "unenroll"):
                      simctl("spawn", UDID, "notifyutil", "-s", "com.apple.BiometricKit.enrollmentChanged",
                             "1" if m == "enroll" else "0")
                      return notify("com.apple.BiometricKit.enrollmentChanged")
                  if m == "match":
                      return notify("com.apple.BiometricKit_Sim.pearl.match")
                  if m == "nomatch":
                      return notify("com.apple.BiometricKit_Sim.pearl.nomatch")
                  return BAD
              if t == "fontsize":
                  d = b.get("dir")
                  return simctl("ui", UDID, "content_size", d) if d in ("increment", "decrement") else BAD
              if t == "contrast":
                  return simctl("ui", UDID, "increase_contrast", "enabled" if b.get("on") else "disabled")
              if t == "loc":
                  try:
                      lat, lon = float(b["lat"]), float(b["lon"])
                  except Exception:
                      return BAD
                  if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                      return BAD
                  return simctl("location", UDID, "set", "%f,%f" % (lat, lon))
              if t == "locclear":
                  return simctl("location", UDID, "clear")
              if t == "locrun":
                  n = b.get("name")
                  return simctl("location", UDID, "run", n) if n in LOC_SCENARIOS else BAD
              if t == "statusbar":
                  m = b.get("mode")
                  if m == "clear":
                      return simctl("status_bar", UDID, "clear")
                  if m == "clean":
                      return simctl("status_bar", UDID, "override", "--time", "9:41", "--batteryState", "charged",
                                    "--batteryLevel", "100", "--cellularMode", "active", "--cellularBars", "4",
                                    "--wifiBars", "3", "--dataNetwork", "wifi")
                  if m == "set":
                      a = ["status_bar", UDID, "override"]

                      def choice(key, flag, allowed):
                          v = b.get(key)
                          if v in allowed:
                              a.extend([flag, v])

                      def number(key, flag, lo, hi):
                          try:
                              v = int(b.get(key))
                          except Exception:
                              return
                          if lo <= v <= hi:
                              a.extend([flag, str(v)])

                      tm = str(b.get("time", "")).strip()
                      # simctl accepts a clock value like 9:41, not an ISO timestamp.
                      if re.match(r"^(?:[0-9]|1\d|2[0-3]):[0-5]\d$", tm):
                          a.extend(["--time", tm])
                      op = str(b.get("op", "")).strip().lstrip("-")[:30]
                      if op:
                          a.extend(["--operatorName", op])
                      choice("cm", "--cellularMode", ("notSupported", "searching", "failed", "active"))
                      number("cb", "--cellularBars", 0, 4)
                      choice("net", "--dataNetwork", ("hide", "wifi", "3g", "4g", "lte", "lte-a", "lte+", "5g", "5g+", "5g-uwb", "5g-uc"))
                      choice("wm", "--wifiMode", ("searching", "failed", "active"))
                      number("wb", "--wifiBars", 0, 3)
                      number("bl", "--batteryLevel", 0, 100)
                      choice("bs", "--batteryState", ("charging", "charged", "discharging"))
                      return simctl(*a)
                  return BAD
              if t == "push":
                  bundle = str(b.get("bundle", ""))
                  if not BUNDLE_RE.match(bundle):
                      return {"ok": False, "msg": "enter a bundle id"}
                  payload = {"aps": {"alert": {"title": str(b.get("title", ""))[:100] or "Test",
                                               "body": str(b.get("body", ""))[:300]}, "sound": "default"}}
                  fd, path = tempfile.mkstemp(suffix=".apns")
                  try:
                      with os.fdopen(fd, "w") as f:
                          json.dump(payload, f)
                      return simctl("push", UDID, bundle, path)
                  finally:
                      try:
                          os.unlink(path)
                      except OSError:
                          pass
              if t == "clip":
                  return simctl("pbcopy", UDID, inp=str(b.get("text", "")))
              if t == "clipget":
                  return simctl("pbpaste", UDID)
              if t == "icloud":
                  return simctl("icloud_sync", UDID)
              if t == "keychain":
                  return simctl("keychain", UDID, "reset")
              if t == "uninstall":
                  bundle = str(b.get("bundle", ""))
                  return simctl("uninstall", UDID, bundle) if BUNDLE_RE.match(bundle) else BAD
              if t == "kill":
                  bundle = str(b.get("bundle", ""))
                  return simctl("terminate", UDID, bundle) if BUNDLE_RE.match(bundle) else BAD
              return None


          BUTTONS = ("HOME", "LOCK", "SIDE_BUTTON", "SIRI", "APPLE_PAY")


          def handle(b):
              t = b.get("t")
              if str(b.get("bundle", "")).startswith("dev.bridge"):
                  return {"ok": False, "msg": "that is the internal button bridge, leave it running"}
              with LOCK:
                  if t == "tap":
                      W, H = points()
                      a = ["ui", "tap", str(round(b["x"] * W)), str(round(b["y"] * H))]
                      if b.get("dur", 0) > 0:
                          a += ["--duration", str(b["dur"])]
                      return idb(a)
                  if t == "swipe":
                      W, H = points()
                      a = ["ui", "swipe", str(round(b["x1"] * W)), str(round(b["y1"] * H)),
                           str(round(b["x2"] * W)), str(round(b["y2"] * H)),
                           "--duration", str(b.get("dur", 0.3))]
                      return idb(a)
                  if t == "button":
                      name = b.get("name", "")
                      if name not in BUTTONS:
                          return {"ok": False, "msg": "bad button"}
                      if name == "SIRI":
                          r = idb(["ui", "button", name, "--duration", "1"])
                          if r["ok"]:
                              return r
                      return idb(["ui", "button", name])
                  if t == "text":
                      return idb(["ui", "text", str(b.get("text", ""))])
                  if t == "key":
                      return idb(["ui", "key", str(int(b["code"]))])
                  if t == "appearance":
                      mode = b.get("mode")
                      if mode not in ("light", "dark"):
                          return {"ok": False, "msg": "bad mode"}
                      return run(["xcrun", "simctl", "ui", UDID, "appearance", mode])
                  if t == "openurl":
                      return run(["xcrun", "simctl", "openurl", UDID, str(b.get("url", ""))])
                  if t == "launch":
                      return run(["xcrun", "simctl", "launch", UDID, str(b.get("bundle", ""))])
                  r = extra(b)
                  if r is not None:
                      return r
              return {"ok": False, "msg": "unknown action"}


          HQ = asyncio.Queue()


          async def hid_pump():
              try:
                  from idb.common.types import HIDPress, HIDTouch, HIDDirection, Point
              except Exception as e:
                  log("live touch unavailable (idb types):", repr(e))
                  return
              NATIVE["ev"] = (HIDPress, HIDTouch, HIDDirection, Point)

              async def gen():
                  while True:
                      yield await HQ.get()

              while not STOP_EV.is_set():
                  if not NATIVE["c"]:
                      await asyncio.sleep(0.5)
                      continue
                  while not HQ.empty():
                      HQ.get_nowait()
                  NATIVE["hid"] = True
                  log("live touch stream open")
                  try:
                      await NATIVE["c"].hid(gen())
                  except Exception as e:
                      log("live touch stream restarting:", repr(e))
                  NATIVE["hid"] = False
                  await asyncio.sleep(0.5)


          def touch(b, st):
              t = b.get("t")
              try:
                  fx = min(1.0, max(0.0, float(b["x"])))
                  fy = min(1.0, max(0.0, float(b["y"])))
              except Exception:
                  return
              if t == "td":
                  st["start"] = (fx, fy, time.time())
              ev = NATIVE.get("ev")
              if ev and NATIVE.get("hid") and POINTS["v"]:
                  W, H = POINTS["v"]
                  if t == "tm" and HQ.qsize() > 6:
                      return
                  press, tch, direction, point = ev
                  HQ.put_nowait(press(tch(point(fx * W, fy * H)), direction.UP if t == "tu" else direction.DOWN))
                  return
              if not POINTS["v"]:
                  th = asyncio.create_task(asyncio.to_thread(points))
                  BG.add(th)
                  th.add_done_callback(BG.discard)
              if t != "tu" or not st.get("start"):
                  return
              sx, sy, t0 = st["start"]
              st["start"] = None
              if abs(fx - sx) + abs(fy - sy) < 0.02:
                  req = {"t": "tap", "x": fx, "y": fy, "dur": 0}
              else:
                  req = {"t": "swipe", "x1": sx, "y1": sy, "x2": fx, "y2": fy,
                         "dur": max(0.08, min(time.time() - t0, 0.5))}
              th = asyncio.create_task(handle_async(req))
              BG.add(th)
              th.add_done_callback(BG.discard)


          async def init_native():
              try:
                  from idb.common.types import TCPAddress, HIDButtonType
                  from idb.grpc.client import Client
                  stack = AsyncExitStack()
                  client = await stack.enter_async_context(Client.build(
                      address=TCPAddress(host="localhost", port=GRPC_PORT),
                      logger=logging.getLogger("idb")))
                  NATIVE["c"] = client
                  NATIVE["btn"] = HIDButtonType
                  NATIVE["stack"] = stack
                  log("native idb client connected: low-latency input enabled")
              except Exception as e:
                  log("native idb client unavailable, using CLI input:", repr(e))


          async def handle_async(b):
              t = b.get("t")
              if t == "installurl":
                  return await asyncio.get_running_loop().run_in_executor(POOL, install_url, b)
              if t == "button" and b.get("name") == "SIRI":
                  threading.Thread(target=siri_diag, daemon=True).start()
              async with INPUT_LOCK:
                  c = NATIVE["c"]
                  if c and t in ("tap", "swipe", "button", "text", "key"):
                      try:
                          if t in ("tap", "swipe"):
                              W, H = POINTS["v"] or await asyncio.to_thread(points)
                          if t == "tap":
                              d = float(b.get("dur", 0) or 0)
                              await c.tap(round(b["x"] * W), round(b["y"] * H), d if d > 0 else None)
                          elif t == "swipe":
                              await c.swipe((round(b["x1"] * W), round(b["y1"] * H)),
                                            (round(b["x2"] * W), round(b["y2"] * H)),
                                            duration=float(b.get("dur", 0.3)))
                          elif t == "button":
                              name = b.get("name", "")
                              if name not in BUTTONS:
                                  return {"ok": False, "msg": "bad button"}
                              await c.button(getattr(NATIVE["btn"], name), 1.0 if name == "SIRI" else None)
                          elif t == "text":
                              await c.text(str(b.get("text", "")))
                          elif t == "key":
                              await c.key(int(b["code"]))
                          return {"ok": True, "msg": "ok"}
                      except Exception as e:
                          log("native input failed, falling back to CLI:", repr(e))
                  return await asyncio.get_running_loop().run_in_executor(POOL, handle, b)


          async def publish(data):
              async with COND:
                  FRAME["data"] = data
                  FRAME["id"] += 1
                  COND.notify_all()


          async def log_stderr(proc):
              try:
                  while True:
                      line = await proc.stderr.readline()
                      if not line:
                          return
                      log("[idb video-stream]", line.decode(errors="replace").rstrip())
              except Exception:
                  pass


          async def stream_idb():
              gen = STREAM["gen"]
              cmd = [IDB, "video-stream", "--fps", STREAM["fps"], "--format", "mjpeg",
                     "--compression-quality", STREAM["quality"], "--scale-factor", STREAM["scale"], "--udid", UDID]
              log("starting:", " ".join(cmd))
              proc = await asyncio.create_subprocess_exec(
                  *cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)
              asyncio.create_task(log_stderr(proc))
              buf = bytearray()
              got = False
              try:
                  while not STOP_EV.is_set():
                      if STREAM["gen"] != gen:
                          return "restart"
                      try:
                          chunk = await asyncio.wait_for(proc.stdout.read(65536), timeout=(3 if got else 20))
                      except asyncio.TimeoutError:
                          if not got:
                              log("no video frames within 20s")
                          else:
                              log("idb video stream stalled: no bytes for 3s; switching to screenshot fallback")
                          return False
                      if not chunk:
                          log("idb video-stream ended")
                          return False
                      buf += chunk
                      latest = None
                      while True:
                          soi = buf.find(b"\xff\xd8")
                          if soi < 0:
                              buf.clear()
                              break
                          eoi = buf.find(b"\xff\xd9", soi + 2)
                          if eoi < 0:
                              if soi > 0:
                                  del buf[:soi]
                              break
                          latest = bytes(buf[soi:eoi + 2])
                          del buf[:eoi + 2]
                      if len(buf) > 20_000_000:
                          buf.clear()
                      if latest:
                          if not got:
                              got = True
                              MODE["v"] = "idb mjpeg stream"
                              log("first frame received; streaming via idb mjpeg")
                          if latest != FRAME["data"]:
                              await publish(latest)
                  return True
              finally:
                  if proc.returncode is None:
                      proc.kill()


          async def stream_screenshots():
              MODE["v"] = "screenshot fallback (slow)"
              log("using screenshot fallback")
              tmp = tempfile.gettempdir()
              raw = os.path.join(tmp, "sim_raw.jpg")
              small = os.path.join(tmp, "sim_small.jpg")
              while not STOP_EV.is_set():
                  t = time.time()
                  p = await asyncio.create_subprocess_exec(
                      "xcrun", "simctl", "io", UDID, "screenshot", "--type=jpeg", raw,
                      stdout=asyncio.subprocess.DEVNULL, stderr=asyncio.subprocess.DEVNULL)
                  if await p.wait() == 0:
                      src = raw
                      if SCALE_H > 0:
                          s = await asyncio.create_subprocess_exec(
                              "sips", "--resampleHeight", str(SCALE_H), "-s", "formatOptions", "60",
                              raw, "--out", small,
                              stdout=asyncio.subprocess.DEVNULL, stderr=asyncio.subprocess.DEVNULL)
                          if await s.wait() == 0:
                              src = small
                      try:
                          data = await asyncio.to_thread(lambda: open(src, "rb").read())
                          await publish(data)
                      except Exception:
                          pass
                  dt = time.time() - t
                  if dt < 0.05:
                      await asyncio.sleep(0.05 - dt)


          async def capture():
              if shutil.which(IDB):
                  while await stream_idb() == "restart":
                      log("restarting video stream with new quality")
                  if STOP_EV.is_set():
                      return
                  log("idb stream unavailable, falling back")
              else:
                  log("idb not installed, falling back")
              await stream_screenshots()


          def authed(request):
              cands = [request.query.get("key", ""), request.cookies.get("k", "")]
              return any(c and hmac.compare_digest(c.encode(), TOKEN.encode()) for c in cands)


          async def index(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              resp = web.Response(text=PAGE, content_type="text/html", charset="utf-8")
              resp.set_cookie("k", TOKEN, path="/", httponly=True, secure=True, samesite="Lax")
              return resp


          async def shot(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              p = os.path.join(tempfile.gettempdir(), "shot.png")
              r = await asyncio.to_thread(
                  subprocess.run, ["xcrun", "simctl", "io", UDID, "screenshot", p], capture_output=True)
              if r.returncode != 0:
                  return web.Response(status=500, text="screenshot failed")
              data = await asyncio.to_thread(lambda: open(p, "rb").read())
              return web.Response(body=data, content_type="image/png",
                                  headers={"Content-Disposition": "attachment; filename=simulator.png"})


          async def sender(ws, st):
              last = 0
              while not ws.closed:
                  while st["inflight"] >= WINDOW and not ws.closed:
                      try:
                          await asyncio.wait_for(st["ack"].wait(), 3)
                      except asyncio.TimeoutError:
                          st["inflight"] = 0
                      st["ack"].clear()
                  async with COND:
                      await COND.wait_for(lambda: FRAME["id"] > last or STOP_EV.is_set())
                      data, last = FRAME["data"], FRAME["id"]
                  if STOP_EV.is_set():
                      await ws.send_json({"t": "stopped"})
                      return
                  st["inflight"] += 1
                  await ws.send_bytes(data)


          async def ws_handler(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              ws = web.WebSocketResponse(heartbeat=20, compress=False, max_msg_size=1 << 20)
              await ws.prepare(request)
              await ws.send_json({"t": "toast", "msg": "video: " + MODE["v"]})
              st = {"inflight": 0, "ack": asyncio.Event()}
              task = asyncio.create_task(sender(ws, st))

              async def do_input(b):
                  try:
                      res = await handle_async(b)
                  except Exception as e:
                      res = {"ok": False, "msg": "error: %s" % e}
                  msg = res.get("msg", "ok")
                  if not ws.closed and (not res.get("ok", True) or msg != "ok"):
                      await ws.send_json({"t": "toast", "msg": msg})

              try:
                  async for msg in ws:
                      if msg.type != WSMsgType.TEXT:
                          continue
                      try:
                          b = json.loads(msg.data)
                      except Exception:
                          continue
                      t = b.get("t")
                      if t == "ack":
                          st["inflight"] = max(0, st["inflight"] - 1)
                          st["ack"].set()
                          continue
                      if t == "stream":
                          try:
                              f = max(5, min(60, int(b["fps"])))
                              s = max(0.2, min(1.0, float(b["scale"])))
                              q = max(0.2, min(1.0, float(b["quality"])))
                              STREAM.update(fps=str(f), scale=str(s), quality=str(q))
                              STREAM["gen"] += 1
                              await ws.send_json({"t": "toast", "msg": "video: %d fps, size %.2f, quality %.2f" % (f, s, q)})
                          except Exception:
                              await ws.send_json({"t": "toast", "msg": "bad stream settings"})
                          continue
                      if t in ("td", "tm", "tu"):
                          touch(b, st)
                          continue
                      if t == "stop":
                          STOP_EV.set()
                          async with COND:
                              COND.notify_all()
                          continue
                      th = asyncio.create_task(do_input(b))
                      BG.add(th)
                      th.add_done_callback(BG.discard)
              finally:
                  task.cancel()
              return ws


          def audio_broadcast(data):
              if not AUDIO_CLIENTS:
                  return
              if data.count(0) == len(data):
                  return
              for q in list(AUDIO_CLIENTS):
                  if q.full():
                      try:
                          q.get_nowait()
                      except asyncio.QueueEmpty:
                          pass
                  q.put_nowait(data)


          def start_audio(loop):
              if os.environ.get("AUDIO", "true").lower() == "false":
                  log("audio disabled")
                  return
              try:
                  import audioop
                  import sounddevice as sd
              except Exception as e:
                  log("audio unavailable (import failed):", repr(e))
                  return
              try:
                  idx = None
                  for i, d in enumerate(sd.query_devices()):
                      if AUDIO_DEVICE.lower() in d["name"].lower() and d["max_input_channels"] > 0:
                          idx = i
                          break
                  if idx is None:
                      log("audio device '%s' not found. Available:" % AUDIO_DEVICE)
                      log(sd.query_devices())
                      return
                  info = sd.query_devices(idx)
                  src_rate = int(info["default_samplerate"])
                  src_ch = max(1, min(2, int(info["max_input_channels"])))
                  out_ch = 1 if AUDIO_CH == 1 else src_ch
                  state = [None]
                  stats = {"n": 0}

                  def cb(indata, frames, tinfo, status):
                      raw = bytes(indata)
                      ch = src_ch
                      if src_ch == 2 and out_ch == 1:
                          raw = audioop.tomono(raw, 2, 0.5, 0.5)
                          ch = 1
                      if src_rate != AUDIO_RATE:
                          raw, state[0] = audioop.ratecv(raw, 2, ch, src_rate, AUDIO_RATE, state[0])
                      stats["n"] += 1
                      if stats["n"] == 1:
                          loop.call_soon_threadsafe(log, "audio capture running")
                      loop.call_soon_threadsafe(audio_broadcast, raw)

                  stream = sd.RawInputStream(device=idx, samplerate=src_rate, channels=src_ch,
                                             dtype="int16", blocksize=src_rate // 50, callback=cb)
                  stream.start()
                  AUDIO.update(ok=True, ch=out_ch, stream=stream)
                  log("audio: %s %d Hz x%d -> %d Hz x%d PCM" % (info["name"], src_rate, src_ch, AUDIO_RATE, out_ch))
              except Exception as e:
                  log("audio capture failed (microphone permission?):", repr(e))


          async def ws_audio(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              ws = web.WebSocketResponse(heartbeat=20, compress=False)
              await ws.prepare(request)
              await ws.send_json({"t": "fmt", "ok": AUDIO["ok"], "rate": AUDIO_RATE, "ch": AUDIO["ch"]})
              q = asyncio.Queue(maxsize=25)
              AUDIO_CLIENTS.add(q)

              async def pump():
                  while not ws.closed:
                      await ws.send_bytes(await q.get())

              task = asyncio.create_task(pump())
              try:
                  async for _ in ws:
                      pass
              finally:
                  task.cancel()
                  AUDIO_CLIENTS.discard(q)
              return ws


          MIC_DEVICE = os.environ.get("MIC_DEVICE", "BlackHole 16ch")
          MIC = {"ok": False, "rate": 48000, "buf": bytearray(), "lock": threading.Lock(),
                 "primed": False, "err": "", "frames": 0, "peak": 0}


          def start_mic():
              if os.environ.get("AUDIO", "true").lower() == "false":
                  MIC["err"] = "audio is disabled for this run"
                  return
              try:
                  import sounddevice as sd
              except Exception as e:
                  MIC["err"] = "sounddevice is not installed"
                  log("microphone unavailable (sounddevice):", repr(e))
                  return
              try:
                  idx = None
                  for i, d in enumerate(sd.query_devices()):
                      if MIC_DEVICE.lower() in d["name"].lower() and d["max_output_channels"] > 0:
                          idx = i
                          break
                  if idx is None:
                      MIC["err"] = "virtual device '%s' not found" % MIC_DEVICE
                      log("mic device '%s' not found. Available:" % MIC_DEVICE)
                      log(sd.query_devices())
                      return
                  rate = int(sd.query_devices(idx)["default_samplerate"])
                  MIC["rate"] = rate
                  prime = rate * 4 * 6 // 100

                  def cb(outdata, frames, tinfo, status):
                      need = frames * 4
                      chunk = b""
                      with MIC["lock"]:
                          have = len(MIC["buf"])
                          if not MIC["primed"] and have >= prime:
                              MIC["primed"] = True
                          if MIC["primed"]:
                              if have >= need:
                                  chunk = bytes(MIC["buf"][:need])
                                  del MIC["buf"][:need]
                              else:
                                  MIC["primed"] = False
                      if len(chunk) < need:
                          chunk += b"\0" * (need - len(chunk))
                      outdata[:] = chunk

                  stream = sd.RawOutputStream(device=idx, samplerate=rate, channels=2, dtype="int16", callback=cb)
                  stream.start()
                  MIC.update(ok=True, stream=stream)
                  try:
                      import audioop
                      in_ch = max(1, min(2, int(sd.query_devices(idx)["max_input_channels"])))

                      def mcb(indata, frames, tinfo, status):
                          MIC["peak"] = max(MIC["peak"], audioop.max(bytes(indata), 2))

                      mstream = sd.RawInputStream(device=idx, samplerate=rate, channels=in_ch, dtype="int16", callback=mcb)
                      mstream.start()
                      MIC["monitor"] = mstream
                  except Exception as e:
                      log("microphone loopback monitor unavailable:", repr(e))
                  log("microphone: browser audio -> %s at %d Hz" % (MIC_DEVICE, rate))
              except Exception as e:
                  MIC["err"] = "could not open %s: %s" % (MIC_DEVICE, e)
                  log("microphone output failed:", repr(e))


          def audio_boot(loop):
              start_audio(loop)
              start_mic()


          async def ws_mic(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              import audioop
              ws = web.WebSocketResponse(heartbeat=20, compress=False, max_msg_size=1 << 18)
              await ws.prepare(request)
              await ws.send_json({"t": "fmt", "ok": MIC["ok"], "err": MIC["err"]})
              in_rate, state = 16000, None
              got = False

              async def levels():
                  while not ws.closed:
                      await asyncio.sleep(0.5)
                      pk, MIC["peak"] = MIC["peak"], 0
                      if not ws.closed:
                          await ws.send_json({"t": "lvl", "v": min(100, round(pk / 327.68))})

              lv = asyncio.create_task(levels())
              async for msg in ws:
                  if msg.type == WSMsgType.TEXT:
                      try:
                          j = json.loads(msg.data)
                          if j.get("t") == "fmt":
                              in_rate = max(8000, min(96000, int(j.get("rate", 16000))))
                              state = None
                      except Exception:
                          pass
                  elif msg.type == WSMsgType.BINARY and MIC["ok"]:
                      data = msg.data[: len(msg.data) // 2 * 2]
                      if not data:
                          continue
                      if not got:
                          got = True
                          log("microphone: receiving browser audio at %d Hz" % in_rate)
                      if in_rate != MIC["rate"]:
                          data, state = audioop.ratecv(data, 2, 1, in_rate, MIC["rate"], state)
                      data = audioop.tostereo(data, 2, 1, 1)
                      with MIC["lock"]:
                          MIC["buf"] += data
                          cap = MIC["rate"] * 2
                          if len(MIC["buf"]) > cap:
                              del MIC["buf"][: len(MIC["buf"]) - cap]
              lv.cancel()
              return ws


          APP_EXTS = (".zip", ".ipa", ".tgz", ".tar.gz")


          def find_app(root):
              for dp, dns, _ in os.walk(root):
                  for d in sorted(dns):
                      if d.endswith(".app"):
                          return os.path.join(dp, d)
              return None


          def install_any(path, launch):
              work = tempfile.mkdtemp(prefix="app_")
              try:
                  low = path.lower()
                  if low.endswith((".zip", ".ipa")):
                      r = run(["ditto", "-x", "-k", path, work], timeout=300)
                  elif low.endswith((".tgz", ".tar.gz")):
                      r = run(["tar", "-xzf", path, "-C", work], timeout=300)
                  else:
                      return {"ok": False, "msg": "use a .zip, .tar.gz or .ipa that contains a Simulator .app"}
                  if not r["ok"]:
                      return {"ok": False, "msg": "could not unpack: " + r["msg"]}
                  app = find_app(work)
                  if not app:
                      return {"ok": False, "msg": "no .app found inside the archive"}
                  r = run(["xcrun", "simctl", "install", UDID, app], timeout=300)
                  if not r["ok"]:
                      return {"ok": False, "msg": "install failed (must be a Simulator build): " + r["msg"]}
                  bid = ""
                  try:
                      p = subprocess.run(["plutil", "-extract", "CFBundleIdentifier", "raw", "-o", "-",
                                          os.path.join(app, "Info.plist")], capture_output=True, text=True, timeout=20)
                      bid = p.stdout.strip()
                  except Exception:
                      pass
                  msg = "installed " + (bid or os.path.basename(app))
                  if bid and BUNDLE_RE.match(bid):
                      run(["xcrun", "simctl", "privacy", UDID, "grant", "microphone", bid])
                  if launch and bid and BUNDLE_RE.match(bid):
                      lr = run(["xcrun", "simctl", "launch", UDID, bid])
                      if not lr["ok"]:
                          msg += " (launch failed: " + lr["msg"][:120] + ")"
                  return {"ok": True, "msg": msg, "bundle": bid}
              finally:
                  shutil.rmtree(work, ignore_errors=True)


          def install_url(b):
              url = str(b.get("url", "")).strip()
              if not url.lower().startswith("https://"):
                  return {"ok": False, "msg": "the link must start with https://"}
              pth = urllib.parse.urlparse(url).path.lower()
              ext = ".tar.gz" if pth.endswith((".tar.gz", ".tgz")) else ".ipa" if pth.endswith(".ipa") else ".zip"
              d = tempfile.mkdtemp(prefix="dl_")
              p = os.path.join(d, "dl" + ext)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  total = 0
                  with urllib.request.urlopen(req, timeout=60) as r, open(p, "wb") as f:
                      while True:
                          c = r.read(1 << 20)
                          if not c:
                              break
                          total += len(c)
                          if total > 1_500_000_000:
                              return {"ok": False, "msg": "file is larger than 1.5 GB"}
                          f.write(c)
                  return install_any(p, bool(b.get("launch")))
              except Exception as e:
                  return {"ok": False, "msg": "download failed: %s" % e}
              finally:
                  shutil.rmtree(d, ignore_errors=True)


          def list_apps():
              p1 = subprocess.run(["xcrun", "simctl", "listapps", UDID], capture_output=True, text=True, timeout=40)
              p2 = subprocess.run(["plutil", "-convert", "json", "-o", "-", "-"], input=p1.stdout,
                                  capture_output=True, text=True, timeout=20)
              data = json.loads(p2.stdout)
              out = []
              for bid, info in data.items():
                  out.append({"id": bid,
                              "name": info.get("CFBundleDisplayName") or info.get("CFBundleName") or bid,
                              "user": info.get("ApplicationType") == "User"})
              out = [a for a in out if not a["id"].startswith("dev.bridge")]
              out.sort(key=lambda a: (not a["user"], a["name"].lower()))
              return out


          async def apps_handler(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              try:
                  return web.json_response({"apps": await asyncio.to_thread(list_apps)})
              except Exception as e:
                  return web.json_response({"apps": [], "error": str(e)}, status=500)


          async def install_upload(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              name = os.path.basename(request.query.get("name", "app.zip")).lower()
              ext = next((e for e in (".tar.gz", ".tgz", ".zip", ".ipa") if name.endswith(e)), None)
              if not ext:
                  return web.json_response({"ok": False, "msg": "use a .zip, .tar.gz or .ipa file"})
              d = tempfile.mkdtemp(prefix="up_")
              path = os.path.join(d, "upload" + ext)
              try:
                  with open(path, "wb") as f:
                      async for chunk in request.content.iter_chunked(1 << 20):
                          await asyncio.to_thread(f.write, chunk)
                  res = await asyncio.to_thread(install_any, path, request.query.get("launch") == "1")
                  return web.json_response(res)
              finally:
                  shutil.rmtree(d, ignore_errors=True)


