name: Remote iOS 26.5 Simulator

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'iOS version'
        default: '26.5'
        required: true
      device:
        description: 'Simulator device name'
        default: 'iPhone 17 Pro'
        required: true
      audio:
        description: 'Stream simulator audio + microphone'
        type: boolean
        default: true
      timezone:
        description: 'Time zone'
        default: 'America/New_York'
        required: true

jobs:
  simulator:
    name: iOS ${{ inputs.version }}
    runs-on: macos-26
    timeout-minutes: 355
    env:
      VER: ${{ inputs.version }}
      DEVICE: ${{ inputs.device }}
      AUDIO: ${{ inputs.audio }}
      TZNAME: ${{ inputs.timezone }}
      MINUTES: '300'
      FPS: '24'
      SCALE: '0.35'
      QUALITY: '0.40'

    steps:
      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then
            echo "No Xcode 26 found"
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Ensure iOS runtime
        run: |
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -q "iOS ${VER}"; then
            echo "Downloading runtime..."
            xcodebuild -downloadPlatform iOS -buildVersion "${VER}" || true
          fi
          xcrun simctl list runtimes

      - name: Install BlackHole + route audio
        if: ${{ inputs.audio }}
        continue-on-error: true
        run: |
          brew install switchaudio-osx
          brew install --cask blackhole-2ch blackhole-16ch
          sudo killall coreaudiod || true
          sleep 4
          for i in $(seq 1 25); do
            SwitchAudioSource -a -t output | grep -q "BlackHole 2ch" && \
            SwitchAudioSource -a -t input  | grep -q "BlackHole 16ch" && break
            sleep 1
          done
          SwitchAudioSource -s "BlackHole 2ch" -t output || true
          SwitchAudioSource -s "BlackHole 16ch" -t input  || true
          echo "Output → $(SwitchAudioSource -c -t output)"
          echo "Input  → $(SwitchAudioSource -c -t input)"

      - name: Set time zone
        continue-on-error: true
        run: |
          sudo systemsetup -settimezone "$TZNAME" || true
          date

      - name: Grant microphone permissions
        if: ${{ inputs.audio }}
        continue-on-error: true
        run: |
          PYS=$(ls /Users/runner/hostedtoolcache/Python/*/*/bin/python3* 2>/dev/null | tr '\n' ' ')
          XC=$(xcode-select -p)
          APP="${XC%/Developer}"
          CLIENTS_BID="com.apple.Terminal com.apple.dt.Xcode com.apple.CoreSimulator.CoreSimulatorService com.apple.iphonesimulator"
          CLIENTS_PATH="/bin/bash /bin/zsh /usr/bin/python3 /usr/bin/xcrun $APP/Contents/Developer/Applications/Simulator.app $(command -v python3 || true) $PYS"
          add() {
            db="$1"; svc="$2"; client="$3"; ctype="$4"
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier_type,indirect_object_identifier,flags,last_modified) VALUES ('$svc','$client',$ctype,2,4,1,0,'UNUSED',0,strftime('%s','now'));" 2>/dev/null || true
          }
          for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
            [ -f "$db" ] || continue
            for c in $CLIENTS_BID; do add "$db" kTCCServiceMicrophone "$c" 0; done
            for c in $CLIENTS_PATH; do [ -n "$c" ] && add "$db" kTCCServiceMicrophone "$c" 1; done
          done
          sudo killall tccd 2>/dev/null || true
          sleep 1

      - name: Create and boot simulator
        run: |
          RT_ID=$(xcrun simctl list runtimes -j | jq -r --arg v "$VER" \
            '[.runtimes[] | select(.platform=="iOS" and (.version|startswith($v)))][0].identifier // empty')
          if [ -z "$RT_ID" ]; then
            RT_ID=$(xcrun simctl list runtimes -j | jq -r \
              '[.runtimes[] | select(.platform=="iOS" and .isAvailable==true)] | sort_by(.version | split(".") | map(tonumber? // 0)) | last | .identifier // empty')
          fi
          [ -n "$RT_ID" ] || { echo "No iOS runtime"; exit 1; }
          echo "Runtime: $RT_ID"

          DT=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" --arg n "$DEVICE" \
            '[.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | select(.name==$n)][0].identifier // empty')
          if [ -z "$DT" ]; then
            DT=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" \
              '[.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | select(.productFamily=="iPhone")][0].identifier')
          fi
          UDID=$(xcrun simctl create "Remote-$VER" "$DT" "$RT_ID")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl privacy "$UDID" grant microphone || true
          xcrun simctl privacy "$UDID" grant location || true
          xcrun simctl location "$UDID" set 37.7749,-122.4194 || true
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl list devices | grep "$UDID"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          brew install cloudflared
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion
          pip install fb-idb aiohttp sounddevice
          idb --help | head -2
          cloudflared --version

      - name: Install simpod
        continue-on-error: true
        run: |
          if ! command -v dart >/dev/null; then
            brew tap dart-lang/dart
            brew trust dart-lang/dart || true
            brew install dart
          fi
          dart pub global activate simpod
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build button bridge
        continue-on-error: true
        run: |
          brew install xcodegen
          mkdir -p bridge/Host bridge/BridgeUITests
          cd bridge
          cat > project.yml <<'YML'
          name: Bridge
          options:
            bundleIdPrefix: dev.bridge
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              GENERATE_INFOPLIST_FILE: YES
              CODE_SIGNING_ALLOWED: NO
              CODE_SIGNING_REQUIRED: NO
          targets:
            Host:
              type: application
              platform: iOS
              sources: [Host]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: dev.bridge.host
            BridgeUITests:
              type: bundle.ui-testing
              platform: iOS
              sources: [BridgeUITests]
              dependencies:
                - target: Host
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: dev.bridge.uitests
          schemes:
            Bridge:
              build:
                targets:
                  Host: all
                  BridgeUITests: [test]
              test:
                targets: [BridgeUITests]
          YML
          cat > Host/App.swift <<'SW'
          import SwiftUI
          @main struct HostApp: App { var body: some Scene { WindowGroup { Text("button bridge") } } }
          SW
          cat > BridgeUITests/ButtonBridge.swift <<'SW'
          import XCTest
          final class ButtonBridge: XCTestCase {
              @MainActor
              func setVolume(_ delta: Double) -> String {
                  let sb = XCUIApplication(bundleIdentifier: "com.apple.springboard")
                  let top = sb.coordinate(withNormalizedOffset: CGVector(dx: 0.95, dy: 0.0))
                  let mid = sb.coordinate(withNormalizedOffset: CGVector(dx: 0.95, dy: 0.5))
                  top.press(forDuration: 0.1, thenDragTo: mid)
                  Thread.sleep(forTimeInterval: 0.8)
                  let pred = NSPredicate(format: "label CONTAINS[c] 'volume' OR identifier CONTAINS[c] 'volume'")
                  let slider = sb.sliders.matching(pred).firstMatch
                  var result = "volume slider not found"
                  if slider.waitForExistence(timeout: 2) {
                      var cur = 0.5
                      if let s = slider.value as? String, let n = Double(s.replacingOccurrences(of: "%", with: "")) { cur = n / 100 }
                      let next = min(1.0, max(0.0, cur + delta))
                      slider.adjust(toNormalizedSliderPosition: CGFloat(next))
                      result = "ok"
                  }
                  XCUIDevice.shared.press(.home)
                  return result
              }
              @MainActor
              func testLoop() throws {
                  continueAfterFailure = true
                  let home = ProcessInfo.processInfo.environment["SIMULATOR_HOST_HOME"] ?? NSHomeDirectory()
                  let cmd = home + "/xcbtn.cmd", ready = home + "/xcbtn.ready", out = home + "/xcbtn.result"
                  let fm = FileManager.default
                  fm.createFile(atPath: ready, contents: Data("1".utf8))
                  defer { try? fm.removeItem(atPath: ready) }
                  let device = XCUIDevice.shared
                  let end = Date().addingTimeInterval(6 * 3600)
                  while Date() < end {
                      if let data = fm.contents(atPath: cmd), let raw = String(data: data, encoding: .utf8) {
                          try? fm.removeItem(atPath: cmd)
                          let c = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                          var result = "ok"
                          if c == "action" {
                              if device.hasHardwareButton(.action) { device.press(.action) }
                              else { result = "unsupported Action Button" }
                          } else if c == "volume_up" {
                              result = self.setVolume(0.0625)
                          } else if c == "volume_down" {
                              result = self.setVolume(-0.0625)
                          } else if c.hasPrefix("siri:") {
                              device.siriService.activate(voiceRecognitionText: String(c.dropFirst(5)))
                          } else {
                              result = "unknown command"
                          }
                          fm.createFile(atPath: out, contents: Data(result.utf8))
                      }
                      Thread.sleep(forTimeInterval: 0.05)
                  }
              }
          }
          SW
          xcodegen generate
          xcodebuild build-for-testing -project Bridge.xcodeproj -scheme Bridge \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tail -15
          ls build/Build/Products/*.xctestrun || true

      - name: Write the web server
        run: |
          cat > server.py << 'PYEOF'
          import asyncio, hmac, json, logging, os, re, shutil, subprocess, sys, tempfile, threading, time
          import urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from contextlib import AsyncExitStack
          from aiohttp import web, WSMsgType

          UDID = os.environ["UDID"]
          TOKEN = os.environ["TOKEN"]
          PORT = int(os.environ.get("PORT", "8080"))
          GRPC_PORT = int(os.environ.get("GRPC_PORT", "10882"))
          IDB = os.environ.get("IDB", "idb")
          FPS = os.environ.get("FPS", "24")
          SCALE = os.environ.get("SCALE", "0.35")
          QUALITY = os.environ.get("QUALITY", "0.40")
          WINDOW = 3
          STREAM = {"fps": FPS, "scale": SCALE, "quality": QUALITY, "gen": 0}

          FRAME = {"data": b"", "id": 0}
          MODE = {"v": "starting"}
          POINTS = {"v": None}
          NATIVE = {"c": None, "btn": None}
          COND = asyncio.Condition()
          STOP_EV = asyncio.Event()
          INPUT_LOCK = asyncio.Lock()
          POOL = ThreadPoolExecutor(max_workers=4)
          LOCK = threading.Lock()
          BG = set()

          AUDIO_DEVICE = os.environ.get("AUDIO_DEVICE", "BlackHole 2ch")
          AUDIO_RATE = int(os.environ.get("AUDIO_RATE", "24000"))
          AUDIO = {"ok": False, "ch": 1}
          AUDIO_CLIENTS = set()

          def log(*a):
              print(*a, flush=True)

          def run(cmd, timeout=40, inp=None):
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, input=inp)
                  out = (r.stdout + r.stderr).strip()
                  return {"ok": r.returncode == 0, "msg": (out[:300] if out else "ok")}
              except FileNotFoundError:
                  return {"ok": False, "msg": "command not found: " + cmd[0]}
              except Exception as e:
                  return {"ok": False, "msg": str(e)}

          def idb(args):
              return run([IDB] + args + ["--udid", UDID])

          def points():
              if POINTS["v"]:
                  return POINTS["v"]
              out = subprocess.run([IDB, "describe", "--udid", UDID, "--json"],
                                   capture_output=True, text=True, timeout=25).stdout
              sd = json.loads(out)["screen_dimensions"]
              POINTS["v"] = (float(sd["width_points"]), float(sd["height_points"]))
              return POINTS["v"]

          SIMPOD = os.environ.get("SIMPOD", "simpod")
          BUNDLE_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]*$")
          SIM_BUTTONS = ("volume_up", "volume_down", "action")
          BAD = {"ok": False, "msg": "bad request"}

          def volume(name):
              short = name.replace("_", "-")
              for a in (["button", name], ["button", short], [short], [name]):
                  r = simpod(a)
                  if r["ok"]:
                      return {"ok": True, "msg": "volume via simpod"}
              r = bridge(name, wait=10.0)
              if r is not None:
                  return {"ok": r["ok"], "msg": ("volume via Control Center" if r["ok"] else r["msg"])}
              return idb(["ui", "key", "128" if name == "volume_up" else "129"])

          def simpod(args):
              r = run([SIMPOD] + args + ["-d", UDID])
              if not r["ok"]:
                  r2 = run([SIMPOD] + args)
                  if r2["ok"]:
                      return r2
              return r

          def simctl(*args, inp=None):
              return run(["xcrun", "simctl"] + list(args), inp=inp)

          HOME = os.path.expanduser("~")
          BR_CMD, BR_READY, BR_OUT, BR_RUNNING = (os.path.join(HOME, n) for n in ("xcbtn.cmd", "xcbtn.ready", "xcbtn.result", "xcbtn.running"))

          def bridge(cmd, wait=5.0):
              for _ in range(80):
                  if os.path.exists(BR_READY) or not os.path.exists(BR_RUNNING):
                      break
                  time.sleep(0.25)
              if not os.path.exists(BR_READY):
                  return None
              try:
                  if os.path.exists(BR_OUT):
                      os.unlink(BR_OUT)
                  with open(BR_CMD + ".tmp", "w") as f:
                      f.write(cmd)
                  os.replace(BR_CMD + ".tmp", BR_CMD)
              except Exception as e:
                  return {"ok": False, "msg": "bridge write failed: %s" % e}
              t0 = time.time()
              while time.time() - t0 < wait:
                  if not os.path.exists(BR_CMD) and os.path.exists(BR_OUT):
                      try:
                          msg = open(BR_OUT).read().strip() or "ok"
                      except Exception:
                          msg = "ok"
                      return {"ok": msg == "ok", "msg": msg}
                  time.sleep(0.05)
              return {"ok": False, "msg": "bridge timed out"}

          def extra(b):
              t = b.get("t")
              if t == "simbtn":
                  name = b.get("name")
                  if name not in SIM_BUTTONS:
                      return BAD
                  if name != "action":
                      return volume(name)
                  r = bridge(name)
                  if r is not None:
                      return r
                  return {"ok": False, "msg": "Action button needs XCUITest bridge"}
              if t == "siri":
                  text = str(b.get("text", "")).strip()[:200]
                  if not text:
                      return {"ok": False, "msg": "type what to ask Siri"}
                  r = bridge("siri:" + text, wait=12.0)
                  return r if r is not None else {"ok": False, "msg": "Ask Siri needs XCUITest bridge"}
              if t == "rotate":
                  r = simpod(["rotate-left" if b.get("dir") == "left" else "rotate-right"])
                  POINTS["v"] = None
                  return r
              if t == "shake":
                  return notify("com.apple.UIKit.SimulatorShake")
              if t == "clip":
                  return simctl("pbcopy", UDID, inp=str(b.get("text", "")))
              if t == "clipget":
                  return simctl("pbpaste", UDID)
              if t == "uninstall":
                  bundle = str(b.get("bundle", ""))
                  return simctl("uninstall", UDID, bundle) if BUNDLE_RE.match(bundle) else BAD
              if t == "kill":
                  bundle = str(b.get("bundle", ""))
                  return simctl("terminate", UDID, bundle) if BUNDLE_RE.match(bundle) else BAD
              if t == "location":
                  lat = b.get("lat")
                  lon = b.get("lon")
                  if lat is None or lon is None:
                      return {"ok": False, "msg": "need lat and lon"}
                  return simctl("location", UDID, "set", f"{lat},{lon}")
              if t == "statusbar":
                  args = ["status_bar", UDID, "override"]
                  if "time" in b: args += ["--time", str(b["time"])]
                  if "battery" in b: args += ["--batteryLevel", str(int(b["battery"]))]
                  if "wifi" in b: args += ["--wifiBars", str(int(b["wifi"]))]
                  if "cellular" in b: args += ["--cellularBars", str(int(b["cellular"]))]
                  if "data" in b: args += ["--dataNetwork", str(b["data"])]
                  if "operator" in b: args += ["--operatorName", str(b["operator"])]
                  return simctl(*args)
              if t == "statusbar_clear":
                  return simctl("status_bar", UDID, "clear")
              return None

          def notify(name):
              return simctl("spawn", UDID, "notifyutil", "-p", name)

          BUTTONS = ("HOME", "LOCK", "SIDE_BUTTON", "SIRI", "APPLE_PAY")

          def handle(b):
              t = b.get("t")
              if str(b.get("bundle", "")).startswith("dev.bridge"):
                  return {"ok": False, "msg": "leave the button bridge running"}
              with LOCK:
                  if t == "tap":
                      W, H = points()
                      a = ["ui", "tap", str(round(b["x"] * W)), str(round(b["y"] * H))]
                      if b.get("dur", 0) > 0:
                          a += ["--duration", str(b["dur"])]
                      return idb(a)
                  if t == "swipe":
                      W, H = points()
                      a = ["ui", "swipe", str(round(b["x1"] * W)), str(round(b["y1"] * H)),
                           str(round(b["x2"] * W)), str(round(b["y2"] * H)),
                           "--duration", str(b.get("dur", 0.3))]
                      return idb(a)
                  if t == "button":
                      name = b.get("name", "")
                      if name not in BUTTONS:
                          return {"ok": False, "msg": "bad button"}
                      if name == "SIRI":
                          r = idb(["ui", "button", name, "--duration", "1"])
                          if r["ok"]:
                              return r
                      return idb(["ui", "button", name])
                  if t == "text":
                      return idb(["ui", "text", str(b.get("text", ""))])
                  if t == "key":
                      return idb(["ui", "key", str(int(b["code"]))])
                  if t == "appearance":
                      mode = b.get("mode")
                      if mode not in ("light", "dark"):
                          return {"ok": False, "msg": "bad mode"}
                      return run(["xcrun", "simctl", "ui", UDID, "appearance", mode])
                  if t == "openurl":
                      return run(["xcrun", "simctl", "openurl", UDID, str(b.get("url", ""))])
                  if t == "launch":
                      return run(["xcrun", "simctl", "launch", UDID, str(b.get("bundle", ""))])
                  r = extra(b)
                  if r is not None:
                      return r
              return {"ok": False, "msg": "unknown action"}

          HQ = asyncio.Queue()

          async def hid_pump():
              try:
                  from idb.common.types import HIDPress, HIDTouch, HIDDirection, Point
              except Exception as e:
                  log("live touch unavailable:", repr(e))
                  return
              NATIVE["ev"] = (HIDPress, HIDTouch, HIDDirection, Point)

              async def gen():
                  while True:
                      yield await HQ.get()

              while not STOP_EV.is_set():
                  if not NATIVE["c"]:
                      await asyncio.sleep(0.5)
                      continue
                  while not HQ.empty():
                      HQ.get_nowait()
                  NATIVE["hid"] = True
                  log("live touch stream open")
                  try:
                      await NATIVE["c"].hid(gen())
                  except Exception as e:
                      log("live touch stream restarting:", repr(e))
                  NATIVE["hid"] = False
                  await asyncio.sleep(0.5)

          def touch(b, st):
              t = b.get("t")
              try:
                  fx = min(1.0, max(0.0, float(b["x"])))
                  fy = min(1.0, max(0.0, float(b["y"])))
              except Exception:
                  return
              pid = b.get("id", 0)
              if t == "td":
                  st.setdefault("starts", {})[pid] = (fx, fy, time.time())
              ev = NATIVE.get("ev")
              if ev and NATIVE.get("hid") and POINTS["v"]:
                  W, H = POINTS["v"]
                  if t == "tm" and HQ.qsize() > 12:
                      return
                  press, tch, direction, point = ev
                  HQ.put_nowait(press(tch(point(fx * W, fy * H)), direction.UP if t == "tu" else direction.DOWN))
                  return
              if not POINTS["v"]:
                  th = asyncio.create_task(asyncio.to_thread(points))
                  BG.add(th)
                  th.add_done_callback(BG.discard)
              if t != "tu":
                  return
              starts = st.get("starts", {})
              if pid not in starts:
                  return
              sx, sy, t0 = starts.pop(pid)
              if abs(fx - sx) + abs(fy - sy) < 0.02:
                  req = {"t": "tap", "x": fx, "y": fy, "dur": 0}
              else:
                  req = {"t": "swipe", "x1": sx, "y1": sy, "x2": fx, "y2": fy,
                         "dur": max(0.08, min(time.time() - t0, 0.5))}
              th = asyncio.create_task(handle_async(req))
              BG.add(th)
              th.add_done_callback(BG.discard)

          async def init_native():
              try:
                  from idb.common.types import TCPAddress, HIDButtonType
                  from idb.grpc.client import Client
                  stack = AsyncExitStack()
                  client = await stack.enter_async_context(Client.build(
                      address=TCPAddress(host="localhost", port=GRPC_PORT),
                      logger=logging.getLogger("idb")))
                  NATIVE["c"] = client
                  NATIVE["btn"] = HIDButtonType
                  NATIVE["stack"] = stack
                  log("native idb client connected")
              except Exception as e:
                  log("native idb client unavailable:", repr(e))

          async def handle_async(b):
              t = b.get("t")
              if t == "installurl":
                  return await asyncio.get_running_loop().run_in_executor(POOL, install_url, b)
              async with INPUT_LOCK:
                  c = NATIVE["c"]
                  if c and t in ("tap", "swipe", "button", "text", "key"):
                      try:
                          if t in ("tap", "swipe"):
                              W, H = POINTS["v"] or await asyncio.to_thread(points)
                          if t == "tap":
                              d = float(b.get("dur", 0) or 0)
                              await c.tap(round(b["x"] * W), round(b["y"] * H), d if d > 0 else None)
                          elif t == "swipe":
                              await c.swipe((round(b["x1"] * W), round(b["y1"] * H)),
                                            (round(b["x2"] * W), round(b["y2"] * H)),
                                            duration=float(b.get("dur", 0.3)))
                          elif t == "button":
                              name = b.get("name", "")
                              if name not in BUTTONS:
                                  return {"ok": False, "msg": "bad button"}
                              await c.button(getattr(NATIVE["btn"], name), 1.0 if name == "SIRI" else None)
                          elif t == "text":
                              await c.text(str(b.get("text", "")))
                          elif t == "key":
                              await c.key(int(b["code"]))
                          return {"ok": True, "msg": "ok"}
                      except Exception as e:
                          log("native input failed, falling back:", repr(e))
                  return await asyncio.get_running_loop().run_in_executor(POOL, handle, b)

          async def publish(data):
              async with COND:
                  FRAME["data"] = data
                  FRAME["id"] += 1
                  COND.notify_all()

          async def stream_idb():
              gen = STREAM["gen"]
              cmd = [IDB, "video-stream",
                     "--fps", STREAM["fps"],
                     "--format", "mjpeg",
                     "--compression-quality", STREAM["quality"],
                     "--scale-factor", STREAM["scale"],
                     "--udid", UDID]
              log("starting idb stream:", " ".join(cmd))
              proc = await asyncio.create_subprocess_exec(
                  *cmd, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE)

              async def log_stderr():
                  try:
                      while True:
                          line = await proc.stderr.readline()
                          if not line: return
                          log("[idb]", line.decode(errors="replace").rstrip())
                  except: pass
              asyncio.create_task(log_stderr())

              buf = bytearray()
              got = False
              try:
                  while not STOP_EV.is_set():
                      if STREAM["gen"] != gen:
                          return "restart"
                      try:
                          chunk = await asyncio.wait_for(proc.stdout.read(65536), timeout=(6 if got else 12))
                      except asyncio.TimeoutError:
                          if not got:
                              log("no frames in 12s — idb failed to start")
                          else:
                              log("idb stream stalled — restarting")
                          return "restart"
                      if not chunk:
                          log("idb video-stream ended")
                          return False
                      buf += chunk
                      latest = None
                      while True:
                          soi = buf.find(b"\xff\xd8")
                          if soi < 0:
                              buf.clear()
                              break
                          eoi = buf.find(b"\xff\xd9", soi + 2)
                          if eoi < 0:
                              if soi > 0: del buf[:soi]
                              break
                          latest = bytes(buf[soi:eoi + 2])
                          del buf[:eoi + 2]
                      if len(buf) > 8_000_000:
                          buf.clear()
                      if latest:
                          if not got:
                              got = True
                              MODE["v"] = "idb mjpeg"
                              log(">>> first frame received — streaming via idb <<<")
                          if latest != FRAME["data"]:
                              await publish(latest)
                  return True
              finally:
                  if proc.returncode is None:
                      proc.kill()

          async def capture():
              restarts = 0
              while not STOP_EV.is_set():
                  result = await stream_idb()
                  if result == "restart":
                      restarts += 1
                      log("restarting idb stream (attempt %d)" % restarts)
                      await asyncio.sleep(min(0.8 + restarts * 0.4, 3.0))
                      continue
                  if result is False:
                      restarts += 1
                      log("idb failed, retrying in 2s (attempt %d)" % restarts)
                      await asyncio.sleep(2.0)
                      continue
                  break

          def authed(request):
              cands = [request.query.get("key", ""), request.cookies.get("k", "")]
              return any(c and hmac.compare_digest(c.encode(), TOKEN.encode()) for c in cands)

          async def index(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              page = PAGE.replace("__FPS__", FPS).replace("__SCALE__", SCALE).replace("__QUALITY__", QUALITY)
              resp = web.Response(text=page, content_type="text/html", charset="utf-8")
              resp.set_cookie("k", TOKEN, path="/", httponly=True, secure=True, samesite="Lax")
              return resp

          async def shot(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              p = os.path.join(tempfile.gettempdir(), "shot.png")
              r = await asyncio.to_thread(
                  subprocess.run, ["xcrun", "simctl", "io", UDID, "screenshot", p], capture_output=True)
              if r.returncode != 0:
                  return web.Response(status=500, text="screenshot failed")
              data = await asyncio.to_thread(lambda: open(p, "rb").read())
              return web.Response(body=data, content_type="image/png",
                                  headers={"Content-Disposition": "attachment; filename=simulator.png"})

          async def sender(ws, st):
              last = 0
              while not ws.closed:
                  while st["inflight"] >= WINDOW and not ws.closed:
                      try:
                          await asyncio.wait_for(st["ack"].wait(), 1.8)
                      except asyncio.TimeoutError:
                          st["inflight"] = 0
                      st["ack"].clear()
                  async with COND:
                      await COND.wait_for(lambda: FRAME["id"] > last or STOP_EV.is_set())
                      data, last = FRAME["data"], FRAME["id"]
                  if STOP_EV.is_set():
                      await ws.send_json({"t": "stopped"})
                      return
                  st["inflight"] += 1
                  await ws.send_bytes(data)

          async def ws_handler(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              ws = web.WebSocketResponse(heartbeat=20, compress=False, max_msg_size=1 << 20)
              await ws.prepare(request)
              await ws.send_json({"t": "toast", "msg": "video: " + MODE["v"]})
              st = {"inflight": 0, "ack": asyncio.Event(), "starts": {}}
              task = asyncio.create_task(sender(ws, st))

              async def do_input(b):
                  try:
                      res = await handle_async(b)
                  except Exception as e:
                      res = {"ok": False, "msg": "error: %s" % e}
                  msg = res.get("msg", "ok")
                  if not ws.closed and (not res.get("ok", True) or msg != "ok"):
                      await ws.send_json({"t": "toast", "msg": msg})

              try:
                  async for msg in ws:
                      if msg.type != WSMsgType.TEXT:
                          continue
                      try:
                          b = json.loads(msg.data)
                      except Exception:
                          continue
                      t = b.get("t")
                      if t == "ack":
                          st["inflight"] = max(0, st["inflight"] - 1)
                          st["ack"].set()
                          continue
                      if t == "stream":
                          try:
                              f = max(10, min(40, int(b["fps"])))
                              s = max(0.20, min(0.55, float(b["scale"])))
                              q = max(0.20, min(0.60, float(b["quality"])))
                              STREAM.update(fps=str(f), scale=str(s), quality=str(q))
                              STREAM["gen"] += 1
                              await ws.send_json({"t": "toast", "msg": "stream: %d fps · scale %.2f · q %.2f" % (f, s, q)})
                          except Exception:
                              await ws.send_json({"t": "toast", "msg": "bad stream settings"})
                          continue
                      if t in ("td", "tm", "tu"):
                          touch(b, st)
                          continue
                      if t == "stop":
                          STOP_EV.set()
                          async with COND:
                              COND.notify_all()
                          continue
                      th = asyncio.create_task(do_input(b))
                      BG.add(th)
                      th.add_done_callback(BG.discard)
              finally:
                  task.cancel()
              return ws

          def audio_broadcast(data):
              if not AUDIO_CLIENTS:
                  return
              if data.count(0) == len(data):
                  return
              for q in list(AUDIO_CLIENTS):
                  if q.full():
                      try: q.get_nowait()
                      except: pass
                  q.put_nowait(data)

          def start_audio(loop):
              if os.environ.get("AUDIO", "true").lower() == "false":
                  log("audio disabled")
                  return
              try:
                  import audioop, sounddevice as sd
              except Exception as e:
                  log("audio import failed:", repr(e))
                  return
              try:
                  idx = None
                  for i, d in enumerate(sd.query_devices()):
                      if AUDIO_DEVICE.lower() in d["name"].lower() and d["max_input_channels"] > 0:
                          idx = i
                          break
                  if idx is None:
                      log("audio device not found")
                      return
                  info = sd.query_devices(idx)
                  src_rate = int(info["default_samplerate"])
                  src_ch = max(1, min(2, int(info["max_input_channels"])))
                  out_ch = 1
                  state = [None]
                  stats = {"n": 0}

                  def cb(indata, frames, tinfo, status):
                      raw = bytes(indata)
                      ch = src_ch
                      if src_ch == 2 and out_ch == 1:
                          raw = audioop.tomono(raw, 2, 0.5, 0.5)
                          ch = 1
                      if src_rate != AUDIO_RATE:
                          raw, state[0] = audioop.ratecv(raw, 2, ch, src_rate, AUDIO_RATE, state[0])
                      stats["n"] += 1
                      if stats["n"] == 1:
                          loop.call_soon_threadsafe(log, "audio capture started")
                      loop.call_soon_threadsafe(audio_broadcast, raw)

                  stream = sd.RawInputStream(device=idx, samplerate=src_rate, channels=src_ch,
                                             dtype="int16", blocksize=src_rate // 40, callback=cb)
                  stream.start()
                  AUDIO.update(ok=True, ch=out_ch, stream=stream)
                  log("audio OK")
              except Exception as e:
                  log("audio capture failed:", repr(e))

          async def ws_audio(request):
              if not authed(request):
                  return web.Response(status=403, text="forbidden")
              ws = web.WebSocketResponse(heartbeat=20, compress=False)
              await ws.prepare(request)
              await ws.send_json({"t": "fmt", "ok": AUDIO["ok"], "rate": AUDIO_RATE, "ch": AUDIO["ch"]})
              q = asyncio.Queue(maxsize=20)
              AUDIO_CLIENTS.add(q)

              async def pump():
                  while not ws.closed:
                      await ws.send_bytes(await q.get())

              task = asyncio.create_task(pump())
              try:
                  async for _ in ws:
                      pass
              finally:
                  task.cancel()
