          .grid{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
          .muted,small{color:var(--muted);font-size:12px}
          .drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:1.5px dashed #34405c;border-radius:12px;padding:18px 10px;cursor:pointer;color:var(--muted)}
          .drop.over,.drop:hover{border-color:var(--accent);color:var(--text)}
          .prog{height:5px;background:#1c2130;border-radius:3px;overflow:hidden;display:none}
          .prog.on{display:block}
          .prog i{display:block;height:100%;width:0;background:var(--accent)}
          .app{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
          .app:first-child{border-top:0}
          .app .info{flex:1;min-width:120px;display:flex;flex-direction:column}
          .app .info small{word-break:break-all}
          #toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#222a3d;border:1px solid #34405c;border-radius:12px;padding:10px 14px;max-width:min(90vw,420px);opacity:0;pointer-events:none;transition:.2s;z-index:20;font-size:13px}
          #toast.show{opacity:1;transform:translate(-50%,0)}
          @media(max-width:820px){main{grid-template-columns:1fr}#stage{position:static}.pane{max-height:none}}
          </style></head><body>
          <div id="app">
            <header id="top">
              <span class="dot" id="dot"></span><span id="conn">Connecting</span><span id="fps"></span>
              <span class="grow"></span>
              <button class="chip" id="abtn" onclick="toggleAudio()">Sound</button>
              <button class="chip" id="mbtn" onclick="toggleMic()">Mic off</button>
            </header>
            <main>
              <section id="stage">
                <div id="bezel"><div id="scr"><canvas id="cv" width="390" height="844"></canvas></div></div>
                <div id="dock">
                  <button onclick="btn('HOME')">Home</button>
                  <button onclick="btn('LOCK')">Lock</button>
                  <button onclick="post('/simbtn',{name:'volume_down'})">Vol −</button>
                  <button onclick="post('/simbtn',{name:'volume_up'})">Vol +</button>
                  <button onclick="post('/simbtn',{name:'action'})">Action</button>
                  <button onclick="btn('SIRI')">Siri</button>
                </div>
              </section>
              <aside id="panel">
                <nav id="tabs">
                  <button class="on" data-tab="controls">Controls</button>
                  <button data-tab="apps">Apps</button>
                  <button data-tab="device">Device</button>
                  <button data-tab="session">Session</button>
                </nav>

                <div class="pane on" id="p-controls">
                  <div class="card"><h3>Gestures</h3>
                    <div class="grid g2">
                      <button onclick="gest(0.5,0.995,0.5,0.6,0.25)">Go home</button>
                      <button onclick="gest(0.5,0.995,0.5,0.55,1.0)">App switcher</button>
                      <button onclick="gest(0.5,0.01,0.5,0.6,0.3)">Notifications</button>
                      <button onclick="gest(0.95,0.01,0.95,0.5,0.3)">Control Center</button>
                    </div>
                  </div>
                  <div class="card"><h3>Type</h3>
                    <input id="txt" placeholder="Text to type">
                    <div class="grid g3">
                      <button class="primary" onclick="sendText()">Send</button>
                      <button onclick="post('/key',{code:40})">Enter</button>
                      <button onclick="post('/key',{code:42})">⌫</button>
                    </div>
                  </div>
                  <div class="card"><h3>Clipboard</h3>
                    <input id="clip" placeholder="Text for simulator clipboard">
                    <div class="grid g2"><button onclick="post('/clip',{text:val('clip')})">Set</button><button onclick="post('/clipget',{})">Read</button></div>
                  </div>
                  <div class="card"><h3>Siri</h3>
                    <input id="siritxt" placeholder="Ask Siri…">
                    <button onclick="post('/siri',{text:val('siritxt')})">Ask Siri</button>
                  </div>
                </div>

                <div class="pane" id="p-apps">
                  <div class="card"><h3>Install app</h3>
                    <label class="drop" id="drop">
                      <b style="color:var(--text)">Drop .zip / .ipa / .tar.gz here</b>
                      <small>Must contain a Simulator .app</small>
                      <input id="file" type="file" accept=".zip,.ipa,.tgz,.gz" hidden>
                    </label>
                    <div class="prog" id="prog"><i id="progbar"></i></div>
                    <div class="muted" id="upmsg"></div>
                    <input id="appurl" placeholder="Or paste https:// link">
                    <button onclick="installUrl()">Install from link</button>
                    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="launchafter" checked> Launch after install</label>
                  </div>
                  <div class="card"><h3>Installed apps</h3>
                    <div id="apps"><div class="muted">Loading...</div></div>
                    <button onclick="loadApps()">Refresh</button>
                  </div>
                  <div class="card"><h3>Open a link</h3>
                    <input id="url" placeholder="https://... or myapp://...">
                    <button onclick="post('/openurl',{url:val('url')})">Open</button>
                  </div>
                </div>

                <div class="pane" id="p-device">
                  <div class="card"><h3>Appearance</h3>
                    <div class="grid g2"><button onclick="post('/appearance',{mode:'light'})">Light</button><button onclick="post('/appearance',{mode:'dark'})">Dark</button></div>
                  </div>
                  <div class="card"><h3>Status Bar</h3>
                    <div class="grid g2">
                      <button class="sm" onclick="post('/statusbar',{time:'9:41',battery:100,wifi:3,cellular:4,data:'LTE',operator:'Carrier'})">Full bars</button>
                      <button class="sm" onclick="post('/statusbar',{time:'9:41',battery:20,wifi:1,cellular:1,data:'3G'})">Low signal</button>
                      <button class="sm" onclick="post('/statusbar',{time:'9:41',battery:5,wifi:0,cellular:0,data:'None'})">No service</button>
                      <button class="sm" onclick="post('/statusbar_clear',{})">Clear override</button>
                    </div>
                    <input id="sbtime" placeholder="Time (e.g. 9:41)">
                    <div class="grid g2">
                      <button class="sm" onclick="post('/statusbar',{time:val('sbtime')||'9:41'})">Set time</button>
                      <button class="sm" onclick="post('/statusbar',{battery:parseInt(val('sbbat')||'80')})">Set battery %</button>
                    </div>
                    <input id="sbbat" type="number" min="0" max="100" placeholder="Battery %">
                  </div>
                  <div class="card"><h3>Location</h3>
                    <div class="grid g2">
                      <button class="sm" onclick="setLoc(37.7749,-122.4194)">San Francisco</button>
                      <button class="sm" onclick="setLoc(40.7128,-74.0060)">New York</button>
                      <button class="sm" onclick="setLoc(34.0522,-118.2437)">Los Angeles</button>
                      <button class="sm" onclick="setLoc(51.5074,-0.1278)">London</button>
                    </div>
                    <div class="grid g2">
                      <input id="lat" placeholder="Latitude" value="37.7749">
                      <input id="lon" placeholder="Longitude" value="-122.4194">
                    </div>
                    <button onclick="setLoc(parseFloat(val('lat')),parseFloat(val('lon')))">Set custom location</button>
                    <small class="muted">Real GPS is active by default (San Francisco).</small>
                  </div>
                  <div class="card"><h3>More</h3>
                    <div class="grid g2">
                      <button onclick="post('/shake',{})">Shake</button>
                      <button onclick="post('/rotate',{dir:'left'})">Rotate left</button>
                      <button onclick="post('/rotate',{dir:'right'})">Rotate right</button>
                      <button onclick="btn('APPLE_PAY')">Apple Pay</button>
                    </div>
                  </div>
                </div>

                <div class="pane" id="p-session">
                  <div class="card"><h3>Video stream</h3>
                    <div class="grid g3">
                      <button class="sm" onclick="preset(30,0.35,0.40)">Fast</button>
                      <button class="sm" onclick="preset(45,0.45,0.50)">Balanced</button>
                      <button class="sm" onclick="preset(60,0.55,0.60)">Sharp</button>
                    </div>
                    <label class="f">Frames per second <b id="st_fps_v">__FPS__</b></label>
                    <input id="st_fps" type="range" min="15" max="60" value="__FPS__" oninput="sbv(this)">
                    <label class="f">Size <b id="st_scale_v">__SCALE__</b></label>
                    <input id="st_scale" type="range" min="0.25" max="1" step="0.05" value="__SCALE__" oninput="sbv(this)">
                    <label class="f">Quality <b id="st_quality_v">__QUALITY__</b></label>
                    <input id="st_quality" type="range" min="0.3" max="1" step="0.05" value="__QUALITY__" oninput="sbv(this)">
                    <button class="primary" onclick="applyStream()">Apply</button>
                  </div>
                  <div class="card"><h3>Capture</h3>
                    <button onclick="location.href='/shot.png'">Save screenshot</button>
                  </div>
                  <div class="card"><h3>Session</h3>
                    <button class="danger" onclick="if(confirm('Stop the session?'))post('/stop',{})">Stop session</button>
                  </div>
                </div>
              </aside>
            </main>
          </div>
          <div id="toast"></div>
          <script>
          const cv=document.getElementById('cv'),scr=document.getElementById('scr');
          const ctx=cv.getContext('2d',{alpha:false,desynchronized:true});
          const tt=document.getElementById('toast'),fpsEl=document.getElementById('fps');
          function val(i){return document.getElementById(i).value}
          function toast(m){tt.textContent=m;tt.classList.add('show');clearTimeout(tt._t);tt._t=setTimeout(()=>tt.classList.remove('show'),3500)}
          let ws=null,stopped=false,retry=0;
          function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else toast('not connected')}
          function ack(){if(ws&&ws.readyState===1)ws.send('{"t":"ack"}')}
          function post(p,b){send(Object.assign({t:p.slice(1)},b||{}))}
          function btn(n){post('/button',{name:n})}
          function gest(x1,y1,x2,y2,d){post('/swipe',{x1:x1,y1:y1,x2:x2,y2:y2,dur:d})}
          function sendText(){post('/text',{text:val('txt')});document.getElementById('txt').value=''}
          function setLoc(lat,lon){if(isNaN(lat)||isNaN(lon)){toast('bad coordinates');return}post('/location',{lat:lat,lon:lon});toast('Location set')}

          let pending=null,busy=false,frames=0,received=0,lastT=performance.now();
          async function drain(){
            busy=true;
            while(pending){
              const b=pending;pending=null;
              try{
                const jpeg = b instanceof Blob ? b : new Blob([b],{type:'image/jpeg'});
                const bm=await createImageBitmap(jpeg);
                if(cv.width!==bm.width||cv.height!==bm.height){cv.width=bm.width;cv.height=bm.height}
                ctx.drawImage(bm,0,0);bm.close();
                frames++;
              }catch(e){}
              ack();
            }
            busy=false;
          }
          setInterval(()=>{
            const n=performance.now(),dt=Math.max(1,n-lastT);
            fpsEl.textContent=(frames*1000/dt).toFixed(1)+' fps · received '+(received*1000/dt).toFixed(1);
            frames=0;received=0;lastT=n;
          },1000);

          function connect(){
            if(stopped||(ws&&ws.readyState<=1))return;
            ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
            ws.onopen=()=>{retry=0;setConn(true);toast('Connected')};
            ws.onmessage=e=>{
              if(typeof e.data==='string'){
                const j=JSON.parse(e.data);
                if(j.t==='toast'){toast(j.msg);if(/^installed/i.test(j.msg)){document.getElementById('upmsg').textContent=j.msg;loadApps()}}
                else if(j.t==='stopped'){stopped=true;audioOff();micOff();toast('session stopped')}
                return;
              }
              received++;
              if(pending)ack();
              pending=e.data;
              if(!busy)drain();
            };
            ws.onclose=()=>{
              if(stopped)return;
              setConn(false);toast('Reconnecting...');
              setTimeout(connect,Math.min(3000,300*Math.pow(1.6,retry++)));
            };
          }
          connect();
          document.addEventListener('visibilitychange',()=>{if(!document.hidden)connect()});
          window.addEventListener('online',connect);

          let actx=null,aws=null,anext=0,arate=24000,ach=1,aon=false,gnode=null,volv=1;
          const abtn=document.getElementById('abtn');
          function setABtn(){abtn.textContent=aon?'Sound on':'Sound off';abtn.classList.toggle('on',aon)}
          function setVol(v){volv=v/100;if(gnode)gnode.gain.value=volv}
          function toggleAudio(){aon?audioOff():audioOn()}
          function audioOn(){
            actx=actx||new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
            if(!gnode){gnode=actx.createGain();gnode.gain.value=volv;gnode.connect(actx.destination)}
            actx.resume();aon=true;setABtn();aconnect();
          }
          function audioOff(){aon=false;if(aws){try{aws.close()}catch(e){}}aws=null;setABtn()}
          function aconnect(){
            if(!aon||stopped)return;
            aws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/wsa');
            aws.binaryType='arraybuffer';
            aws.onmessage=e=>{
              if(typeof e.data==='string'){
                const j=JSON.parse(e.data);
                if(j.t==='fmt'){arate=j.rate;ach=j.ch;if(!j.ok){toast('audio not available on server');audioOff()}}
                return;
              }
              play(e.data);
            };
            aws.onclose=()=>{if(aon&&!stopped)setTimeout(aconnect,1000)};
          }
          function play(buf){
            if(!actx||buf.byteLength<2)return;
            const i16=new Int16Array(buf,0,Math.floor(buf.byteLength/2)),n=Math.floor(i16.length/ach);
            if(!n)return;
            const ab=actx.createBuffer(ach,n,arate);
            for(let c=0;c<ach;c++){const d=ab.getChannelData(c);for(let i=0;i<n;i++)d[i]=i16[i*ach+c]/32768}
            const now=actx.currentTime;
            if(anext<now+0.02)anext=now+0.08;
            else if(anext>now+0.5)return;
            const s=actx.createBufferSource();s.buffer=ab;s.connect(gnode);s.start(anext);anext+=ab.duration;
          }

          let mctx=null,mws=null,mstream=null,mon=false;
          const mbtn=document.getElementById('mbtn');
          function setMBtn(){mbtn.textContent=mon?'Mic on':'Mic off';mbtn.classList.toggle('on',mon)}
          function toggleMic(){mon?micOff():micOn()}
          function mconnect(){
            if(!mon||stopped)return;
            mws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/wsm');
            mws.onopen=()=>{if(mctx)mws.send(JSON.stringify({t:'fmt',rate:mctx.sampleRate}))};
            mws.onmessage=e=>{
              if(typeof e.data!=='string')return;
              const j=JSON.parse(e.data);
              if(j.t==='fmt'&&!j.ok){toast('microphone not available on server'+(j.err?': '+j.err:''));micOff()}
            };
            mws.onclose=()=>{if(mon&&!stopped)setTimeout(mconnect,1000)};
          }
          function toPcm16(f){
            const o=new Int16Array(f.length);
            for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));o[i]=v<0?v*32768:v*32767}
            return o.buffer;
          }
          async function micOn(){
            if(mon)return;
            try{
              if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('needs a secure (https) page');
              mstream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
              const AC=window.AudioContext||window.webkitAudioContext;
              mctx=new AC({latencyHint:'interactive'});
              await mctx.resume();
              const src=mctx.createMediaStreamSource(mstream),mute=mctx.createGain();
              mute.gain.value=0;
              const out=buf=>{if(mws&&mws.readyState===1)mws.send(buf)};
              const node=mctx.createScriptProcessor(4096,1,1);
              node.onaudioprocess=e=>out(toPcm16(e.inputBuffer.getChannelData(0)));
              src.connect(node);node.connect(mute);mute.connect(mctx.destination);
              mon=true;setMBtn();mconnect();toast('microphone on');
            }catch(err){toast('mic: '+(err&&err.message||err));micOff()}
          }
          function micOff(){
            mon=false;
            if(mws){try{mws.close()}catch(e){}}mws=null;
            if(mstream){mstream.getTracks().forEach(t=>t.stop())}mstream=null;
            if(mctx){try{mctx.close()}catch(e){}}mctx=null;
            setMBtn();
          }

          ['pointerup','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(actx&&actx.state==='suspended')actx.resume();if(mctx&&mctx.state==='suspended')mctx.resume()},{passive:true}));
          audioOn();

          // Multi-touch / 2-finger support
          function frac(x,y){const r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(x-r.left)/r.width)),Math.min(1,Math.max(0,(y-r.top)/r.height))]}
          const pointers = new Map();
          let mraf=0;

          function sendTouch(t, id, p){
            if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:t, id:id, x:p[0], y:p[1]}));
          }

          function flushMoves(){
            mraf=0;
            for(const [id, p] of pointers){
              sendTouch('tm', id, p);
            }
          }

          scr.addEventListener('pointerdown', e=>{
            e.preventDefault();
            const p = frac(e.clientX, e.clientY);
            pointers.set(e.pointerId, p);
            try{scr.setPointerCapture(e.pointerId)}catch(_){}
            sendTouch('td', e.pointerId, p);
          });

          scr.addEventListener('pointermove', e=>{
            if(!pointers.has(e.pointerId))return;
            e.preventDefault();
            pointers.set(e.pointerId, frac(e.clientX, e.clientY));
            if(!mraf)mraf=requestAnimationFrame(flushMoves);
          });

          function endPointer(e){
            if(!pointers.has(e.pointerId))return;
            e.preventDefault();
            if(mraf){cancelAnimationFrame(mraf);mraf=0}
            const p = pointers.get(e.pointerId) || frac(e.clientX, e.clientY);
            pointers.delete(e.pointerId);
            sendTouch('tu', e.pointerId, p);
          }
          scr.addEventListener('pointerup', endPointer);
          scr.addEventListener('pointercancel', endPointer);
          scr.addEventListener('pointerleave', e=>{if(e.pointerType==='mouse')endPointer(e)});

          function setConn(ok){document.getElementById('dot').classList.toggle('ok',ok);document.getElementById('conn').textContent=ok?'Connected':'Reconnecting...'}
          document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
            document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
            document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.tab));
            if(b.dataset.tab==='apps')loadApps();
          }));

          function sbv(el){document.getElementById(el.id+'_v').textContent=el.value}
          function setv(id,v){document.getElementById(id).value=v;if(document.getElementById(id+'_v'))document.getElementById(id+'_v').textContent=v}
          function applyStream(){post('/stream',{fps:+val('st_fps'),scale:+val('st_scale'),quality:+val('st_quality')})}
          function preset(f,s,q){setv('st_fps',f);setv('st_scale',s);setv('st_quality',q);applyStream()}

          function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
          function appRow(a,user){
            const row=el('div','app'),info=el('div','info');
            info.appendChild(el('b',null,a.name));info.appendChild(el('small',null,a.id));
            row.appendChild(info);
            const open=el('button','sm primary','Open');open.onclick=()=>post('/launch',{bundle:a.id});row.appendChild(open);
            if(user){
              const stop=el('button','sm','Stop');stop.onclick=()=>post('/kill',{bundle:a.id});row.appendChild(stop);
              const del=el('button','sm danger','Delete');
              del.onclick=()=>{if(confirm('Delete '+a.name+'?')){post('/uninstall',{bundle:a.id});setTimeout(loadApps,1500)}};
              row.appendChild(del);
            }
            return row;
          }
          async function loadApps(){
            const box=document.getElementById('apps');
            try{
              const r=await fetch('/apps',{credentials:'same-origin'}),j=await r.json();
              box.textContent='';
              const user=j.apps.filter(a=>a.user),sys=j.apps.filter(a=>!a.user);
              if(!user.length)box.appendChild(el('div','muted','No installed apps yet.'));
              user.forEach(a=>box.appendChild(appRow(a,true)));
              if(sys.length){
                const d=el('details');d.appendChild(el('summary',null,'System apps ('+sys.length+')'));
                sys.forEach(a=>d.appendChild(appRow(a,false)));box.appendChild(d);
              }
            }catch(e){box.textContent='Could not load apps'}
          }
          function upload(file){
            if(!file)return;
            const pb=document.getElementById('prog'),bar=document.getElementById('progbar'),msg=document.getElementById('upmsg');
            pb.classList.add('on');bar.style.width='0%';msg.textContent='Uploading...';
            const x=new XMLHttpRequest();
            x.open('POST','/install?name='+encodeURIComponent(file.name)+'&launch='+(document.getElementById('launchafter').checked?1:0));
            x.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);bar.style.width=p+'%';msg.textContent='Uploading '+p+'%'}};
            x.upload.onload=()=>{msg.textContent='Installing...'};
            x.onload=()=>{
              pb.classList.remove('on');
              let j={};try{j=JSON.parse(x.responseText)}catch(e){j={msg:'HTTP '+x.status}}
              msg.textContent=j.msg||'';toast(j.msg||'done');loadApps();
            };
            x.onerror=()=>{pb.classList.remove('on');msg.textContent='Upload failed';toast('upload failed')};
            x.send(file);
          }
          document.getElementById('file').addEventListener('change',e=>{upload(e.target.files[0]);e.target.value=''});
          (function(){
            const dz=document.getElementById('drop');
            ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
            ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
            dz.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)upload(f)});
          })();
          function installUrl(){
            const u=val('appurl').trim();
            if(!u){toast('Paste a link first');return}
            document.getElementById('upmsg').textContent='Downloading and installing...';
            post('/installurl',{url:u,launch:document.getElementById('launchafter').checked});
          }
          loadApps();
          </script></body></html>'''

          async def main():
              app = web.Application()
              app.add_routes([web.get("/", index), web.get("/ws", ws_handler), web.get("/wsa", ws_audio), web.get("/wsm", ws_mic), web.get("/apps", apps_handler), web.post("/install", install_upload), web.get("/shot.png", shot)])
              runner = web.AppRunner(app, access_log=None)
              await runner.setup()
              await web.TCPSite(runner, "127.0.0.1", PORT).start()
              asyncio.create_task(capture())
              asyncio.create_task(init_native())
              asyncio.create_task(hid_pump())
              _loop = asyncio.get_running_loop()
              _loop.run_in_executor(POOL, audio_boot, _loop)
              await STOP_EV.wait()
              await asyncio.sleep(0.5)
              await runner.cleanup()

          if __name__ == "__main__":
              asyncio.run(main())
          PYEOF
          python3 -m py_compile server.py && echo "server.py OK"

      - name: Start session and print the link
        run: |
          export TOKEN=$(openssl rand -hex 12)
          export PORT=8080
          export FPS="${FPS:-60}"
          export SCALE="${SCALE:-0.45}"
          export QUALITY="${QUALITY:-0.50}"
          export WINDOW=4
          export GRPC_PORT=10882

          command -v cloudflared >/dev/null || { echo "cloudflared missing"; exit 1; }

          if [ "$AUDIO" = "true" ] && command -v SwitchAudioSource >/dev/null; then
            SwitchAudioSource -s "BlackHole 2ch" -t output || true
            SwitchAudioSource -s "BlackHole 16ch" -t input || true
          fi

          if command -v idb_companion >/dev/null && command -v idb >/dev/null; then
            nohup idb_companion --udid "$UDID" --grpc-port "$GRPC_PORT" > companion.log 2>&1 &
            for i in $(seq 1 40); do nc -z localhost "$GRPC_PORT" 2>/dev/null && break; sleep 1; done
            if nc -z localhost "$GRPC_PORT" 2>/dev/null; then
              echo "idb companion is listening"
              idb connect localhost "$GRPC_PORT" || true
            else
              echo "idb companion did not start:"
              cat companion.log
            fi
          else
            echo "idb / idb_companion missing"
          fi

          rm -f "$HOME"/xcbtn.cmd "$HOME"/xcbtn.ready "$HOME"/xcbtn.result "$HOME"/xcbtn.running
          XR=$(ls bridge/build/Build/Products/*.xctestrun 2>/dev/null | head -1 || true)
          if [ -n "$XR" ]; then
            touch "$HOME/xcbtn.running"
            XR="$XR" UDID="$UDID" nohup bash -c 'while true; do xcodebuild test-without-building -xctestrun "$XR" -destination "id=$UDID" >> bridge.log 2>&1; rm -f "$HOME/xcbtn.ready"; sleep 2; done' > /dev/null 2>&1 &
            (
              for i in $(seq 1 90); do [ -f "$HOME/xcbtn.ready" ] && break; sleep 2; done
              if [ -f "$HOME/xcbtn.ready" ]; then echo "button bridge ready"; else echo "button bridge NOT ready:"; tail -30 bridge.log; fi
            ) &
          fi

          if command -v simpod >/dev/null; then
            simpod --detach -q || true
            sleep 2
          fi

          nohup python3 server.py > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 90); do
            curl -fsS "http://127.0.0.1:$PORT/?key=$TOKEN" -o /dev/null 2>/dev/null && break
            kill -0 "$SERVER_PID" 2>/dev/null || { echo "server exited:"; cat server.log; exit 1; }
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT/?key=$TOKEN" -o /dev/null || { echo "server not answering:"; cat server.log; exit 1; }
          tail -n +1 -f server.log &

          nohup cloudflared tunnel --url "http://127.0.0.1:$PORT" --no-autoupdate --protocol http2 > cf.log 2>&1 &
          CF_PID=$!
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then cat cf.log; exit 1; fi

          FULL="$URL/?key=$TOKEN"
          echo "::notice title=Simulator link::$FULL"
          {
            echo "## iOS $VER simulator is live"
            echo
            echo "$FULL"
            echo
            echo "Anyone with this link can control the simulator. It ends in $MINUTES minutes or when you press Stop session."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "OPEN THIS: $FULL"

          END=$((SECONDS + MINUTES * 60))
          while kill -0 "$SERVER_PID" 2>/dev/null && [ "$SECONDS" -lt "$END" ]; do sleep 5; done

          kill "$SERVER_PID" "$CF_PID" 2>/dev/null || true
          xcrun simctl shutdown "$UDID" || true
          echo "Session ended."
